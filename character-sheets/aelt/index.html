  <script type="application/json" id="rules-config">{"rulesEdition":"2024","level2Spell":"ice-knife","wizardScholar":"Магия","weaknessEffect":"Аэльт совершает с помехой проверки Интеллекта, если задача требует счёта или работы с числами. При покупке у любого торговца Аэльт платит на 20% больше указанной цены.","equipmentProfiles":[],"sources":["SecretsOfSokolKeep/heroes/Дима - Аэльт.json","tmp/Конструктор персонажа D&D 5.5e – v6.2.html (SPELL_EFFECTS_RU, SPELL_CATALOG_SRD, тексты умений волшебника и эльфа)","https://www.dndbeyond.com/posts/1753-2024-wizard-vs-2014-wizard-whats-new","https://www.dndbeyond.com/sources/dnd/br-2024/spell-descriptions#MagicMissile","https://roll20.net/compendium/dnd5e/Classes:Wizard?expansion=33335","https://www.aidedd.org/en/wizard-2024"],"notes":["Учёный (2-й уровень): в конструкторе выбран «Анализ», но владения Анализом нет — по правилам выбор недействителен; по решению игрока экспертиза отражена в навыке Магия.","Заклинание 2-го уровня — Ледяной кинжал (подтверждено игроком); на 1-м подготовлены Доспехи мага, Маскировка, Облако тумана, Огненные ладони.","Магическое восстановление (1-й уровень) не выводится: оно работает на коротком отдыхе, а короткого отдыха в кампании нет.","Заговор наследия высшего эльфа конструктором отдельно не добавлен; один из трёх выбранных заговоров считается заговором наследия (механически одинаково: Интеллект).","Боевой посох — оружие и магическая фокусировка. В таблице книги заклинаний «Волшебная стрела» и «Ледяной кинжал» отмечены как неподготовленные на 1-м уровне.","Параметры волшебника 2024 сверены: 3 заговора, подготовленные 4/5 (фиксированная таблица), ячейки 2/3, книга из 6 заклинаний, Сл 13 и атака +5 при Интеллекте 17."],"itemRules":{"Многообразный инструмент":{"paragraphs":["Обычный чудесный предмет; \u003cb>требуется настройка\u003c/b>. Действием Магия коснитесь его и превратите в выбранный вид ремесленных инструментов. При использовании полученной формы вы владеете ею.","Это не «Всеобъемлющий инструмент +1»: бонус +1 к Сл и атакам заклинаний он не даёт. Он также не заменяет воровские инструменты произвольным превращением."]},"Алхимический сосуд":{"paragraphs":["Необычный чудесный предмет, без настройки. Действием назовите жидкость из таблицы. Затем отдельным действием откройте сосуд и выливайте выбранную жидкость, не быстрее \u003cb>7,6 л в минуту\u003c/b>.","До следующего рассвета нельзя выбрать другую жидкость или превысить её суточный предел. Количества в таблице переведены в метрические единицы и округлены."],"rows":[["Кислота","≈237 мл"],["Простой яд","≈15 мл"],["Пиво","≈15,1 л"],["Мёд","≈3,8 л"],["Майонез","≈7,6 л"],["Масло","≈0,95 л"],["Уксус","≈7,6 л"],["Пресная вода","≈30,3 л"],["Солёная вода","≈45,4 л"],["Вино","≈3,8 л"]],"header":["Жидкость","Максимум"]},"Сумка хранения":{"paragraphs":["Вместимость: \u003cb>до 227 кг и 1,81 м³\u003c/b>; сама весит около 2,3 кг независимо от содержимого. Достать предмет — действие Использование.","При перегрузке, проколе или разрыве сумка уничтожается, вещи рассеиваются в Астрале. Вывернутая сумка высыпает содержимое; для работы её нужно вернуть в обычный вид. Воздуха хватает на 10 минут, делённых на число дышащих существ внутри.","Вложение в другое аналогичное межпространственное хранилище уничтожает оба предмета и открывает односторонний разрыв в Астрал: затягиваются существа в радиусе 10 футов."]},"Оружие повторного выстрела":{"paragraphs":["Требует настройки; оружие с боеприпасами получает \u003cb>+1 к дальнобойным атакам и урону\u003c/b>, игнорирует свойство перезарядки и само создаёт магический боеприпас, если оружие не заряжено. Такой боеприпас исчезает после попадания или промаха.","Если создать эту реплику на основе профиля мушкета, заменить одну из текущих реплик и настроиться, атака будет \u003cb>{{items.repeating.attack}}\u003c/b>, урон \u003cb>{{items.repeating.damage}}\u003c/b> без владения мушкетом. Владение добавило бы ещё {{pb}} к атаке, но не к урону."]}}}</script>
  <script type="application/json" id="spell-catalog">{"friends":{"key":"friends","name":"Дружба","level":0,"school":"Очарование","castingTime":"Действие","range":"10 футов","components":"Соматический, Материальный (немного грима)","duration":"Концентрация, до 1 минуты","body":"\u003cp>Вы магическим образом внушаете чувство дружелюбности в одно видимое вами в пределах дистанции существо. Цель должна преуспеть в спасброске Мудрости Сл {{spellcasting.dc}}, иначе получит состояние Очарованный на время действия заклинания. Цель автоматически преуспевает в этом спасброске, если вы сражаетесь с ней, уже сотворяли на неё это заклинание в течение последних 24 часов или если цель не является Гуманоидом.\u003c/p>\u003cp>Заклинание заканчивается раньше, если цель получает урон или если вы совершаете бросок атаки, наносите урон или заставляете кого-либо совершить спасбросок. Когда заклинание заканчивается, цель знает, что была Очарована вами.\u003c/p>\u003cp>Очарованная цель не может атаковать вас или выбирать целью вредоносных эффектов. Вы получаете преимущество на проверки взаимодействия с ней. Это не подчинение приказам.\u003c/p>","id":"6a130a8fcc5574d767281b46"},"vicious-mockery":{"key":"vicious-mockery","name":"Злая насмешка","level":0,"school":"Очарование","castingTime":"Действие","range":"60 футов","components":"Вербальный","duration":"Мгновенно","summary":"1d6 психического урона и помеха на следующую атаку при провале спасброска Мудрости.","body":"\u003cp>Обратитесь с магической насмешкой к одному существу в пределах дистанции, которое вы видите или слышите. Цель совершает спасбросок Мудрости Сл {{spellcasting.dc}}. При провале она получает 1d6 \u003ci>психического\u003c/i> урона и помеху на следующий бросок атаки, который совершит до конца своего следующего хода.\u003c/p>\u003cp>Урон увеличивается на 1d6 на уровнях персонажа 5 (2d6), 11 (3d6) и 17 (4d6).\u003c/p>"},"animate-skull":{"key":"animate-skull","name":"Оживленный череп","level":0,"school":"Некромантия","castingTime":"Действие","range":"Касание","components":"Вербальный, Соматический, Материальный (череп)","duration":"1 час","body":"\u003cp>Вы наполняете череп некромантической магией и наделяете его следующими эффектами:\u003c/p>\u003cp>● При наложении заклинания вы произносите фразу длиной до 10 слов. Каждый раз, когда существо касается черепа или оказывается в пределах 1 клет. от него, череп повторяет эту фразу.\u003c/p>\u003cp>● Вы наполняете череп вредоносной энергией. Один раз за ход, когда существо, кроме вас, касается черепа, он пытается укусить его. Существо должно совершить спасбросок Ловкости Сл {{spellcasting.dc}}. При провале оно получает 1d4 \u003ci>колющего\u003c/i> урона.\u003c/p>\u003cp>Оживлённый череп имеет КД 6 и 1 хит.\u003c/p>\u003cp>\u003ci>Колющий\u003c/i> урон увеличивается до 2d4, когда вы достигаете 5-го уровня.\u003c/p>\u003cp>\u003cb>Домашнее правило (HB).\u003c/b> Не заклинание PHB.\u003c/p>","id":"6a4e9ce4cb7ab61dc8777c23"},"thunderwave":{"key":"thunderwave","name":"Волна грома","level":1,"school":"Воплощение","castingTime":"Действие","range":"На себя, куб со стороной 15 футов","components":"Вербальный, Соматический","duration":"Мгновенно","body":"\u003cp>От вас исходит волна звуковой энергии в форме куба со стороной 3 клет.. Каждое существо в этой области совершает спасбросок Телосложения против Сл {{spellcasting.dc}}. При провале существо получает 2d8 урона \u003ci>звуком\u003c/i> и отталкивается от вас на 2 клет.. При успехе оно получает половину урона и не отталкивается.\u003c/p>\u003cp>Незакреплённые предметы, полностью находящиеся внутри куба, также отбрасываются на 2 клет. от вас. Громовой удар слышен в пределах 60 клет..\u003c/p>\u003cp>Более высокая ячейка: урон увеличивается на 1d8 за каждый уровень ячейки выше 1-го.\u003c/p>","id":"698197b8a5dc6923c7028b3c"},"heroism":{"key":"heroism","name":"Героизм","level":1,"school":"Очарование","castingTime":"Действие","range":"Касание","components":"Вербальный, Соматический","duration":"Концентрация, до 1 минуты","body":"\u003cp>Коснитесь согласного существа и наполните его отвагой. Пока действует заклинание, цель невосприимчива к состоянию «Испуганный». В начале каждого своего хода она получает временные хиты в количестве, равном вашему модификатору заклинательной характеристики: сейчас это {{spellcasting.mod}} временных хита.\u003c/p>\u003cp>Временные хиты не складываются: новое получение не прибавляется к уже имеющимся. Для поддержания заклинания требуется концентрация.\u003c/p>\u003cp>Более высокая ячейка: можно выбрать ещё одно существо за каждый уровень ячейки выше 1-го.\u003c/p>","id":"698197b7a5dc6923c7028b20"},"dissonant-whispers":{"key":"dissonant-whispers","name":"Диссонирующий шёпот","level":1,"school":"Очарование","castingTime":"Действие","range":"60 футов","components":"Вербальный","duration":"Мгновенно","body":"\u003cp>Выберите одно существо, которое видите в пределах 12 клет.. В его разуме звучит диссонирующая мелодия. Цель совершает спасбросок Мудрости против Сл {{spellcasting.dc}}.\u003c/p>\u003cp>При провале цель получает 3d6 \u003ci>психического\u003c/i> урона и должна немедленно потратить свою реакцию, если она доступна, чтобы удалиться от вас как можно дальше наиболее безопасным путём. При успехе цель получает половину урона и не обязана перемещаться.\u003c/p>\u003cp>Более высокая ячейка: урон увеличивается на 1d6 за каждый уровень ячейки выше 1-го.\u003c/p>","id":"698197b9a5dc6923c7028b5f"},"unseen-servant":{"key":"unseen-servant","name":"Невидимый слуга","level":1,"school":"Призыв","castingTime":"Действие или ритуал","range":"60 футов","components":"Вербальный, Соматический, Материальный (немного бечёвки и дерева)","duration":"1 час","body":"\u003cp>В свободном месте на земле в пределах дистанции возникает невидимая, неразумная, бесформенная сила Среднего размера. Она существует до окончания заклинания и выполняет ваши простые поручения. У слуги КД 10, 1 хит и Сила 2. Он не может атаковать. При снижении его хитов до 0 заклинание заканчивается.\u003c/p>\u003cp>Один раз в каждый свой ход бонусным действием вы можете мысленно приказать слуге переместиться на расстояние до 3 клет. и взаимодействовать с предметом. Он способен выполнять простые дела: приносить вещи, убирать, чинить, складывать одежду, разжигать огонь, подавать еду и наливать напитки.\u003c/p>\u003cp>Получив поручение, слуга выполняет его в меру своих возможностей, затем ждёт следующей команды. Если вы прикажете выполнить задачу, которая уведёт его более чем на 12 клет. от вас, заклинание заканчивается.\u003c/p>\u003cp>Ритуал: можно сотворить без расхода ячейки, увеличив время сотворения на 10 минут. Концентрация не требуется.\u003c/p>","id":"698197cca5dc6923c7028ddc"},"command":{"key":"command","name":"Приказ","level":1,"school":"Очарование","castingTime":"Действие","range":"60 футов","components":"Вербальный","duration":"Мгновенно","summary":"Однословный приказ; при провале спасброска Мудрости цель выполняет его","body":"\u003cp>Произнесите однословную команду существу, которое видите в пределах 12 клет.. Цель совершает спасбросок Мудрости против Сл {{spellcasting.dc}}. При провале она выполняет выбранную команду в свой следующий ход.\u003c/p>\u003cp>«Подойди»: цель движется к вам кратчайшим и наиболее прямым путём; её ход заканчивается, когда она оказывается в пределах 1 клет. от вас.\u003c/p>\u003cp>«Брось»: цель роняет всё, что держит, и заканчивает ход. «Беги»: тратит ход на удаление от вас самым быстрым доступным способом.\u003c/p>\u003cp>«Пади»: цель получает состояние «Лежащий ничком» и заканчивает ход. «Стой»: в свой ход цель не перемещается и не совершает действий или бонусных действий.\u003c/p>\u003cp>Более высокая ячейка: можно выбрать ещё одну цель за каждый уровень ячейки выше 1-го.\u003c/p>","id":"698197dda5dc6923c7029021"},"ray-of-frost":{"key":"ray-of-frost","name":"Луч холода","level":0,"school":"Воплощение","castingTime":"Действие","range":"60 футов","components":"Вербальный, Соматический","duration":"Мгновенно","summary":"Дальнобойная атака: 1d8 урона холодом и −10 футов скорости цели до вашего следующего хода","body":"\u003cp>Совершите дальнобойную атаку заклинанием \u003cb>{{spellcasting.attackSigned}}\u003c/b> по одному существу. При попадании оно получает \u003cb>1d8 урона \u003ci>холодом\u003c/i>\u003c/b>, а его скорость уменьшается на 10 футов до начала вашего следующего хода.\u003c/p>\u003cp>Урон увеличивается на 1d8 при достижении уровней персонажа 5 (2d8), 11 (3d8) и 17 (4d8). Модификатор Интеллекта к этому урону не прибавляется.\u003c/p>","id":"698197c5a5dc6923c7028d03"},"guidance":{"key":"guidance","name":"Наставление","level":0,"school":"Прорицание","castingTime":"Действие","range":"Касание","components":"Вербальный, Соматический","duration":"Концентрация, до 1 минуты","summary":"Касание: союзник получает +1d4 к проверкам одного навыка","body":"\u003cp>Коснитесь согласного существа и выберите один навык. Пока действует заклинание, цель добавляет \u003cb>1d4 к каждой проверке характеристики, использующей этот навык\u003c/b>. На атаки, спасброски и проверки других навыков эта прибавка не действует. Вы можете выбрать себя.\u003c/p>\u003cp>Одновременно поддерживается только одно заклинание с концентрацией.\u003c/p>","id":"698197cba5dc6923c7028dce"},"mending":{"key":"mending","name":"Починка","level":0,"school":"Преобразование","castingTime":"1 минута","range":"Касание","components":"Вербальный, Соматический, Материальный (два куска магнетита)","duration":"Мгновенно","summary":"Чинит один небольшой сломанный предмет","body":"\u003cp>Устраняет один разрыв или поломку предмета, которого вы касаетесь: например, звено цепи, сломанный ключ, разрыв ткани или протекающий бурдюк. Повреждение должно быть не больше \u003cb>0.2 клетки в каждом измерении\u003c/b>. После починки следов поломки не остаётся.\u003c/p>\u003cp>Может восстановить физическую целостность магического предмета, но \u003cb>не возвращает его утраченную магию\u003c/b>.\u003c/p>","id":"698197daa5dc6923c7028fb1"},"prestidigitation":{"key":"prestidigitation","name":"Фокусы","level":0,"school":"Преобразование","castingTime":"Действие","range":"10 футов","components":"Вербальный, Соматический","duration":"До 1 часа","summary":"Мелкие магические эффекты: искры, звуки, запахи, огонь, чистка, метка","body":"\u003cp>Выберите один эффект в пределах дистанции. Одновременно могут действовать до трёх ваших немгновенных эффектов этого заговора.\u003c/p>\u003cp>\u003cb>Ощущение:\u003c/b> мгновенный безвредный эффект — искры, лёгкий ветер, тихие музыкальные звуки или запах. \u003cb>Огонь:\u003c/b> мгновенно зажечь или погасить свечу, факел либо небольшой костёр.\u003c/p>\u003cp>\u003cb>Чистота:\u003c/b> мгновенно очистить или испачкать предмет объёмом до 28 л. \u003cb>Температура и вкус:\u003c/b> охладить, нагреть или придать вкус до 28 л неживого вещества на 1 час.\u003c/p>\u003cp>\u003cb>Метка:\u003c/b> цвет, небольшой знак или символ на предмете/поверхности на 1 час. \u003cb>Малая вещь:\u003c/b> немагическая безделушка или иллюзорное изображение, помещающееся в ладони, до конца вашего следующего хода. Безделушка не имеет денежной ценности и не наносит урон.\u003c/p>\u003cp>Объём 28 л указан округлённо; площади и объёмы не являются дистанцией в клетках.\u003c/p>","id":"698197c9a5dc6923c7028d88"},"identify":{"key":"identify","name":"Опознание","level":1,"school":"Прорицание · Ритуал","castingTime":"1 минута; ритуал — 11 минут","range":"Касание","components":"Вербальный, Соматический, Материальный (жемчужина стоимостью не менее 100 зм)","duration":"Мгновенно","summary":"Раскрывает свойства магического предмета или действующие на существе заклинания; ритуал","body":"\u003cp>Всё время сотворения касайтесь предмета. Если он магический, вы узнаёте его свойства, способ использования, необходимость настройки и количество зарядов. Вы также узнаёте, какие действующие заклинания влияют на предмет; если предмет создан заклинанием — его название.\u003c/p>\u003cp>Вместо предмета можно касаться существа: тогда вы узнаете, какие заклинания сейчас на нём действуют.\u003c/p>\u003cp>\u003cb>Жемчужина не расходуется, но обязательна:\u003c/b> инструменты-фокусировка не заменяют материал с указанной стоимостью. {{materials.identifyNote}} Ритуал не расходует ячейку.\u003c/p>","id":"698197d0a5dc6923c7028e7d"},"longstrider":{"key":"longstrider","name":"Скороход","level":1,"school":"Преобразование","castingTime":"Действие","range":"Касание","components":"Вербальный, Соматический, Материальный (щепотка земли)","duration":"1 час","summary":"Скорость цели +10 футов на 1 час","body":"\u003cp>Скорость существа, которого вы касаетесь, увеличивается на \u003cb>10 футов\u003c/b> до окончания заклинания. Ваша скорость под его действием — \u003cb>{{movement.boostedCells}} клет.\u003c/b> Концентрация не требуется.\u003c/p>\u003cp>За каждый уровень ячейки выше 1-го можно выбрать ещё одно существо.\u003c/p>","id":"698197e6a5dc6923c702914e"},"toll-the-dead":{"key":"toll-the-dead","name":"Погребальный звон","level":0,"school":"Некромантия","castingTime":"Действие","range":"60 футов","components":"Вербальный, Соматический","duration":"Мгновенно","summary":"Спасбросок Мудрости: 1d8 некротией или 1d12, если у цели не полные хиты","body":"\u003cp>Укажите на существо, которое видите в пределах дистанции: вокруг него раздаётся скорбный звон колокола. Цель совершает \u003cb>спасбросок Мудрости Сл {{spellcasting.dc}}\u003c/b>; при провале получает \u003cb>1d8 урона \u003ci>некротией\u003c/i>\u003c/b> или \u003cb>1d12\u003c/b>, если ей не хватает хотя бы одного хита.\u003c/p>\u003cp>Урон возрастает на одну кость на уровнях персонажа 5, 11 и 17.\u003c/p>","id":"696775f3e00af79ebae520ae"},"mage-hand":{"key":"mage-hand","name":"Волшебная рука","level":0,"school":"Призыв","castingTime":"Действие","range":"30 футов","components":"Вербальный, Соматический","duration":"1 минута","summary":"Призрачная рука: манипулирует предметами, открывает двери, переносит до 4,5 кг","body":"\u003cp>В выбранной точке появляется призрачная парящая рука. Ею можно манипулировать предметами, открывать незапёртые двери и контейнеры, убирать или доставать предметы и выливать содержимое сосудов.\u003c/p>\u003cp>В последующие ходы рукой можно управлять \u003cb>действием Магия\u003c/b> и перемещать её до 30 футов. Рука не может атаковать, активировать магические предметы или переносить более 10 фунтов (4,5 кг).\u003c/p>","id":"698197c7a5dc6923c7028d3b"},"fire-bolt":{"key":"fire-bolt","name":"Огненный снаряд","level":0,"school":"Воплощение","castingTime":"Действие","range":"120 футов","components":"Вербальный, Соматический","duration":"Мгновенно","summary":"Дальнобойная атака: 1d10 урона огнём; поджигает бесхозные горючие предметы","body":"\u003cp>Совершите \u003cb>дальнобойную атаку заклинанием\u003c/b> по существу или объекту. При попадании цель получает \u003cb>1d10 урона \u003ci>огнём\u003c/i>\u003c/b>. Горючий объект, который никто не несёт и не носит, загорается.\u003c/p>\u003cp>Урон возрастает на 1d10 на уровнях персонажа 5, 11 и 17.\u003c/p>","id":"698197cfa5dc6923c7028e4c"},"magic-missile":{"key":"magic-missile","name":"Волшебная стрела","level":1,"school":"Воплощение","castingTime":"Действие","range":"120 футов","components":"Вербальный, Соматический","duration":"Мгновенно","summary":"Три стрелы попадают одновременно, каждая наносит 1d4 + 1 урона силовым полем.","body":"\u003cp>Создайте три волшебные стрелы. Для каждой выберите видимое существо в пределах дистанции. Стрелы попадают одновременно, и каждая наносит 1d4 + 1 урона \u003ci>силовым полем\u003c/i>. Их можно направить в одну или несколько целей.\u003c/p>\u003cp>За каждый уровень ячейки выше 1-го создаётся ещё одна стрела.\u003c/p>","id":"698197b4a5dc6923c7028aa9"},"mage-armor":{"key":"mage-armor","name":"Доспехи мага","level":1,"school":"Ограждение","castingTime":"Действие","range":"Касание","components":"Вербальный, Соматический, Материальный (клочок выделанной кожи)","duration":"8 часов","summary":"Цель без доспеха: базовый КД 13 + ЛОВ на 8 часов","body":"\u003cp>Коснитесь согласного существа без доспеха. До конца длительности его \u003cb>базовый КД становится 13 + модификатор Ловкости\u003c/b>. Эффект заканчивается раньше, если цель надевает доспех.\u003c/p>","id":"698197c7a5dc6923c7028d42"},"ice-knife":{"key":"ice-knife","name":"Ледяной кинжал","level":1,"school":"Призыв","castingTime":"Действие","range":"60 футов","components":"Соматический, Материальный (капля воды или кусочек льда)","duration":"Мгновенно","summary":"Попадание: 1d10 колющего. Взрыв в радиусе 1 клет. при любом исходе атаки: 2d6 холодом при провале спасброска Ловкости Сл {{spellcasting.dc}}.","body":"\u003cp>Совершите \u003cb>дальнобойную атаку заклинанием\u003c/b> ледяным осколком. При попадании цель получает \u003cb>1d10 \u003ci>колющего\u003c/i> урона\u003c/b>. Независимо от попадания осколок взрывается: цель и все существа в пределах 5 футов от неё совершают \u003cb>спасброски Ловкости Сл {{spellcasting.dc}}\u003c/b>; при провале — \u003cb>2d6 урона \u003ci>холодом\u003c/i>\u003c/b>.\u003c/p>\u003cp>Урон \u003ci>холодом\u003c/i> увеличивается на 1d6 за уровень ячейки выше 1-го.\u003c/p>","id":"698197c6a5dc6923c7028d0a"},"disguise-self":{"key":"disguise-self","name":"Маскировка","level":1,"school":"Иллюзия","castingTime":"Действие","range":"На себя","components":"Вербальный, Соматический","duration":"1 час","summary":"Меняет внешность и одежду на 1 час. Раскрыть иллюзию можно проверкой Анализа Сл {{spellcasting.dc}}.","body":"\u003cp>На 1 час измените внешность своего тела, одежды, доспехов, оружия и других носимых вещей. Можно казаться на 1 фут выше или ниже, тяжелее или легче, сохраняя тип телосложения.\u003c/p>\u003cp>Иллюзия не выдерживает физического контакта; действием Изучение её можно раскрыть \u003cb>проверкой Интеллекта (Анализ) против Сл заклинаний\u003c/b>.\u003c/p>","id":"698197c0a5dc6923c7028c54"},"fog-cloud":{"key":"fog-cloud","name":"Облако тумана","level":1,"school":"Призыв","castingTime":"Действие","range":"120 футов","components":"Вербальный, Соматический","duration":"Концентрация, до 1 часа","summary":"Туман радиусом 4 клет. сильно заслоняет область до 1 часа. Требуется концентрация.","body":"\u003cp>Создайте \u003cb>сферу тумана радиусом 20 футов\u003c/b>; её область считается \u003cb>сильно заслонённой\u003c/b>. Сильный ветер рассеивает туман.\u003c/p>\u003cp>За каждый уровень ячейки выше 1-го радиус увеличивается на 20 футов.\u003c/p>","id":"698197cda5dc6923c7028dff"},"burning-hands":{"key":"burning-hands","name":"Огненные ладони","level":1,"school":"Воплощение","castingTime":"Действие","range":"На себя","components":"Вербальный, Соматический","duration":"Мгновенно","summary":"Конус 3 клет.: спасбросок Ловкости Сл {{spellcasting.dc}}. При провале 3d6 огнём, при успехе половина.","body":"\u003cp>Все существа в 15-футовом \u003cb>конусе\u003c/b> совершают \u003cb>спасброски Ловкости Сл {{spellcasting.dc}}\u003c/b>. При провале — \u003cb>3d6 урона \u003ci>огнём\u003c/i>\u003c/b>, при успехе — половина. Горючие предметы, которые никто не несёт и не носит, загораются.\u003c/p>\u003cp>Урон растёт на 1d6 за уровень ячейки выше 1-го.\u003c/p>","id":"698197e0a5dc6923c702907c"},"sanctuary":{"key":"sanctuary","name":"Убежище","level":1,"school":"Ограждение","castingTime":"Бонусное действие","range":"30 футов","components":"Вербальный, Соматический, Материальный (осколок зеркала)","duration":"1 минута","summary":"Защищает существо: атакующий проходит спасбросок Мудрости или теряет атаку","body":"\u003cp>Защитите одно существо в пределах дистанции. Любое существо, которое выбирает защищённую цель для броска атаки или наносящего урон заклинания, должно пройти \u003cb>спасбросок Мудрости Сл {{spellcasting.dc}}\u003c/b>. При провале оно выбирает другую цель либо теряет эту атаку или заклинание.\u003c/p>\u003cp>Защита \u003cb>не действует против эффектов по области\u003c/b>. Заклинание заканчивается, если защищённая цель совершает бросок атаки, сотворяет заклинание или наносит урон. Концентрация не требуется.\u003c/p>","id":"698197efa5dc6923c7029274"}}</script>
