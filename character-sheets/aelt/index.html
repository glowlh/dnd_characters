  <script type="application/json" id="character-json">{"main":[{"title":"Аэльт","subtitle":"Эльф · Волшебник 1-го уровня · Дворянин","label":"Основной лист · 1-й уровень","badge":"","scores":[{"name":"Сила","score":9,"mod":"−1"},{"name":"Ловкость","score":14,"mod":"+2"},{"name":"Телосложение","score":13,"mod":"+1"},{"name":"Интеллект","score":17,"mod":"+3"},{"name":"Мудрость","score":12,"mod":"+1"},{"name":"Харизма","score":10,"mod":"+0"}],"columns":[[{"title":"Боевые показатели","rows":[["Класс доспеха",12],["Инициатива","+2"],["Скорость","6 клет."],["Тёмное зрение","12 клет."],["Размер","Средний"],["Максимум хитов",7],["Ячейки 1-го уровня",2],["Пассивное Восприятие",13]],"header":[],"paragraphs":["Долгий отдых возвращает все хиты, ячейки заклинаний и использования способностей."],"summary":true},{"title":"Навыки · итоговые бонусы","rows":[{"header":"Сила −1"},["","Атлетика","−1"],{"header":"Ловкость +2"},["","Акробатика","+2"],["","Ловкость рук","+2"],["","Скрытность","+2"],{"header":"Телосложение +1"},{"header":"Интеллект +3"},["●","История","+5"],["●","Магия","+5"],["●","Природа","+5"],["","Анализ","+3"],["","Религия","+3"],{"header":"Мудрость +1"},["●","Восприятие","+3"],["●","Выживание","+3"],["●","Проницательность","+3"],["","Медицина","+1"],["","Уход за животными","+1"],{"header":"Харизма +0"},["●","Обман","+2"],["●","Убеждение","+2"],["","Выступление","+0"],["","Запугивание","+0"]],"header":[],"paragraphs":["● — владение. Навыки сгруппированы по характеристике, в заголовке группы — её модификатор. Проверка: \u003cb>d20 + указанное значение\u003c/b>, всё уже учтено."],"summary":true}],[{"title":"Атаки","rows":[["Боевой посох","Ближняя","d20 + СИЛ (−1) + НАВ (+2)","1d6−1","дробящий"],["Кинжал","Ближняя; метание 4/12 клет.","d20 + ЛОВ (+2) + НАВ (+2)","1d4+2","колющий"]],"header":["Оружие","Тип атаки","Атака","Урон","Тип урона"],"paragraphs":["ЛОВ — модификатор Ловкости; СИЛ — Силы; НАВ — бонус владения этим оружием (без владения 0); МАГ — магическая прибавка. Бросьте d20 и прибавьте каждое число из формулы один раз."]},{"title":"Высший эльф","paragraphs":["Тип — Фея. \u003cb>Тёмное зрение\u003c/b> (число — в боевых показателях): в тусклом свете видите как при ярком, в темноте — как при тусклом, оттенками серого. \u003cb>Наследие фей:\u003c/b> преимущество на спасброски, чтобы избежать состояния «Очарованный» или прекратить его действие.","\u003cb>Транс:\u003c/b> обычный сон не требуется, магия не может усыпить. Долгий отдых можно завершить за 4 часа медитации, оставаясь в сознании.","\u003cb>Врождённая магия высшего эльфа:\u003c/b> известен один заговор из списка волшебника (включён в книгу заклинаний); заклинательная характеристика — Интеллект."],"text":[]},{"title":"Характер","text":["Шутит самые смешные шутки","Его шутки олицетворяют страдания его души. Через шутки он объясняет всю боль, которую испытвает от общения с миром","Аристократ-гавнокрад","Не умеет делить (даже в столбик)"],"paragraphs":["\u003ci>Аэльт совершает с помехой проверки Интеллекта, если задача требует счёта или работы с числами. При покупке у любого торговца Аэльт платит на 20% больше указанной цены.\u003c/i>"]}]]},{"title":"Способности и заклинания · Аэльт","subtitle":"Волшебник 1-го уровня · заговоров 3 · подготовлено 4","label":"Способности и заклинания · 1-й уровень","badge":"","columns":[[{"title":"Заклинания · краткий список","rows":[["Волшебная рука · заговор","Призрачная рука: манипулирует предметами, открывает двери, переносит до 4,5 кг","Действие"],["Огненный снаряд · заговор","Дальнобойная атака: 1d10 урона огнём; поджигает бесхозные горючие предметы","Действие"],["Погребальный звон · заговор","Спасбросок Мудрости: 1d8 некротией или 1d12, если у цели не полные хиты","Действие"],["Доспехи мага · 1-й ур.","Цель без доспеха: базовый КД 13 + ЛОВ на 8 часов","Действие"],["Маскировка · 1-й ур.","Меняет внешность и одежду на 1 час. Раскрыть иллюзию можно проверкой Анализа Сл 13.","Действие"],["Облако тумана · 1-й ур.","Туман радиусом 4 клет. сильно заслоняет область до 1 часа. Требуется концентрация.","Действие"],["Огненные ладони · 1-й ур.","Конус 3 клет.: спасбросок Ловкости Сл 13. При провале 3d6 огнём, при успехе половина.","Действие"]],"header":["Заклинание","Суть","Время"],"summary":true},{"title":"Использование заклинаний","paragraphs":["\u003cb>Интеллект (модификатор +3) · Сл 13 · атака d20 +5.\u003c/b> Ячейки восстанавливаются после долгого отдыха. Список подготовленных заклинаний после отдыха остаётся прежним. Заговоры ячеек не расходуют.","\u003cb>Вне боя ритуал отыгрывается практически мгновенно.\u003c/b> За столом ожидание пропускается, а в игровом мире проходит указанное время сотворения.","Магическая фокусировка заменяет недорогие материальные компоненты; материалы с указанной стоимостью и расходуемые — нет.","\u003cb>Компоненты:\u003c/b> Вербальный — произнесение магических слов; Соматический — жесты рукой; Материальный — указанный предмет или допустимая фокусировка. Нужны все перечисленные; материалы с указанной стоимостью и расходуемые фокусировкой не заменяются."],"summary":true},{"title":"Знаток ритуалов","paragraphs":["\u003cb>Пассивно · без затрат.\u003c/b> Ритуальные заклинания можно сотворять ритуалом из книги заклинаний, даже если они не подготовлены; во время сотворения читайте их из книги."],"cost":null,"text":[]},{"title":"Маскировка","cost":"ячейка","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · ячейка 1-го уровня.\u003c/b> Уровень 1 · Иллюзия\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> На себя\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический\u003cbr>\u003cb>Длительность:\u003c/b> 1 час (600 ходов)","На 1 час измените внешность своего тела, одежды, доспехов, оружия и других носимых вещей. Можно казаться на 1 фут выше или ниже, тяжелее или легче, сохраняя тип телосложения.","Иллюзия не выдерживает физического контакта; действием Изучение её можно раскрыть \u003cb>проверкой Интеллекта (Анализ) против Сл заклинаний\u003c/b>."]},{"title":"Огненные ладони","cost":"ячейка","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · ячейка 1-го уровня.\u003c/b> Уровень 1 · Воплощение\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> На себя\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический\u003cbr>\u003cb>Длительность:\u003c/b> Мгновенно","Все существа в 15-футовом \u003cb>конусе\u003c/b> совершают \u003cb>спасброски Ловкости Сл 13\u003c/b>. При провале — \u003cb>3d6 урона \u003ci>огнём\u003c/i>\u003c/b>, при успехе — половина. Горючие предметы, которые никто не несёт и не носит, загораются.","Урон растёт на 1d6 за уровень ячейки выше 1-го."]}],[{"title":"Волшебная рука","cost":"бесплатно","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · бесплатно.\u003c/b> Заговор · Призыв\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> 30 футов\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический\u003cbr>\u003cb>Длительность:\u003c/b> 1 минута (10 ходов)","В выбранной точке появляется призрачная парящая рука. Ею можно манипулировать предметами, открывать незапёртые двери и контейнеры, убирать или доставать предметы и выливать содержимое сосудов.","В последующие ходы рукой можно управлять \u003cb>действием Магия\u003c/b> и перемещать её до 30 футов. Рука не может атаковать, активировать магические предметы или переносить более 10 фунтов (4,5 кг)."]},{"title":"Огненный снаряд","cost":"бесплатно","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · бесплатно.\u003c/b> Заговор · Воплощение\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> 120 футов\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический\u003cbr>\u003cb>Длительность:\u003c/b> Мгновенно","Совершите \u003cb>дальнобойную атаку заклинанием\u003c/b> по существу или объекту. При попадании цель получает \u003cb>1d10 урона \u003ci>огнём\u003c/i>\u003c/b>. Горючий объект, который никто не несёт и не носит, загорается.","Урон возрастает на 1d10 на уровнях персонажа 5, 11 и 17."]},{"title":"Погребальный звон","cost":"бесплатно","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · бесплатно.\u003c/b> Заговор · Некромантия\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> 60 футов\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический\u003cbr>\u003cb>Длительность:\u003c/b> Мгновенно","Укажите на существо, которое видите в пределах дистанции: вокруг него раздаётся скорбный звон колокола. Цель совершает \u003cb>спасбросок Мудрости Сл 13\u003c/b>; при провале получает \u003cb>1d8 урона \u003ci>некротией\u003c/i>\u003c/b> или \u003cb>1d12\u003c/b>, если ей не хватает хотя бы одного хита.","Урон возрастает на одну кость на уровнях персонажа 5, 11 и 17."]},{"title":"Доспехи мага","cost":"ячейка","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · ячейка 1-го уровня.\u003c/b> Уровень 1 · Ограждение\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> Касание\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический, Материальный (клочок выделанной кожи)\u003cbr>\u003cb>Длительность:\u003c/b> 8 часов","Коснитесь согласного существа без доспеха. До конца длительности его \u003cb>базовый КД становится 13 + модификатор Ловкости\u003c/b>. Эффект заканчивается раньше, если цель надевает доспех."]},{"title":"Облако тумана","cost":"ячейка","paragraphs":["\u003cb>Концентрация:\u003c/b> да\u003cbr>\u003cb>Основное действие · ячейка 1-го уровня.\u003c/b> Уровень 1 · Призыв\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> 120 футов\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический\u003cbr>\u003cb>Длительность:\u003c/b> до 1 часа (600 ходов)","Создайте \u003cb>сферу тумана радиусом 20 футов\u003c/b>; её область считается \u003cb>сильно заслонённой\u003c/b>. Сильный ветер рассеивает туман.","За каждый уровень ячейки выше 1-го радиус увеличивается на 20 футов."]}]]},{"title":"Аэльт · владения и снаряжение","subtitle":"","label":"Снаряжение · 1-й уровень","badge":"","columns":[[{"title":"Владения и языки","paragraphs":["Инструменты: Драконьи шахматы\nЯзыки: Общий, Эльфийский, Небесный\n","Оружие: простое оружие — владение есть; воинское оружие — нет. Владение конкретным оружием видно по НАВ в формуле атаки."],"summary":true},{"title":"Снаряжение","paragraphs":["\u003cb>Доспех и оружие:\u003c/b> 2 кинжала (одноручное); Магическая фокусировка: боевой посох (универсальное, в одной или двух руках).","\u003cb>Походное снаряжение:\u003c/b> Облачение; Книга заклинаний; Набор учёного: Рюкзак, Книга, Чернила, Писчее перо, Лампа, 10 фляг масла, 10 листов пергамента, Трутница; Предыстория: Игровой набор, отличная одежда, духи.","Деньги на старте: 34 зм."]}],[{"title":"Книга заклинаний","rows":[["Волшебная стрела · 1-й ур.","Три стрелы попадают одновременно, каждая наносит 1d4 + 1 урона силовым полем.","Нет","Нет"],["Доспехи мага · 1-й ур.","Цель без доспеха: базовый КД 13 + ЛОВ на 8 часов","Да","Нет"],["Ледяной кинжал · 1-й ур.","Попадание: 1d10 колющего. Взрыв в радиусе 1 клет. при любом исходе атаки: 2d6 холодом при провале спасброска Ловкости Сл 13.","Нет","Нет"],["Маскировка · 1-й ур.","Меняет внешность и одежду на 1 час. Раскрыть иллюзию можно проверкой Анализа Сл 13.","Да","Нет"],["Облако тумана · 1-й ур.","Туман радиусом 4 клет. сильно заслоняет область до 1 часа. Требуется концентрация.","Да","Нет"],["Огненные ладони · 1-й ур.","Конус 3 клет.: спасбросок Ловкости Сл 13. При провале 3d6 огнём, при успехе половина.","Да","Нет"]],"header":["Заклинание","Краткий эффект","Подгот.","Ритуал"],"summary":true}]]}],"appendix":[{"title":"Аэльт · 2-й уровень","subtitle":"Изменения к основному листу 1-го уровня","label":"Повышение уровня · 1 → 2","badge":" · 2-й уровень","columns":[[{"title":"Что изменяется","rows":[["Максимум хитов","7 → 12 (прирост 5)"],["Ячейки 1-го уровня","2 → 3"],["Подготовленные заклинания","4 → 5"]],"header":[],"paragraphs":["Прирост фиксированный; при броске вместо него — кость класса и модификатор Телосложения."],"summary":true},{"title":"Учёный","paragraphs":["Экспертность в навыке \u003cb>Магия\u003c/b>: бонус владения при его проверках удваивается. Итоговые бонусы уже пересчитаны в таблице ниже."]},{"title":"Итоговые бонусы навыков","rows":[["Магия","+5","+7"]],"header":["Навык","Ур. 1","Ур. 2"],"summary":true}],[{"title":"Ледяной кинжал","cost":"ячейка","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · ячейка 1-го уровня.\u003c/b> Уровень 1 · Призыв\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> 60 футов\u003cbr>\u003cb>Компоненты:\u003c/b> Соматический, Материальный (капля воды или кусочек льда)\u003cbr>\u003cb>Длительность:\u003c/b> Мгновенно","Совершите \u003cb>дальнобойную атаку заклинанием\u003c/b> ледяным осколком. При попадании цель получает \u003cb>1d10 \u003ci>колющего\u003c/i> урона\u003c/b>. Независимо от попадания осколок взрывается: цель и все существа в пределах 5 футов от неё совершают \u003cb>спасброски Ловкости Сл 13\u003c/b>; при провале — \u003cb>2d6 урона \u003ci>холодом\u003c/i>\u003c/b>.","Урон \u003ci>холодом\u003c/i> увеличивается на 1d6 за уровень ячейки выше 1-го."]},{"title":"Без изменений","paragraphs":["КД, инициатива, скорость, тёмное зрение, Сл и атака магии, характеристики и число заговоров при этом переходе не меняются — смотрите основной лист."],"summary":true}]]}]}</script>
