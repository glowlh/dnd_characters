  <script type="application/json" id="character-json">{"main":[{"title":"Наэстриель","subtitle":"Человек · Бард 1-го уровня · Шарлатан","label":"Основной лист · 1-й уровень","badge":"","scores":[{"name":"Сила","score":8,"mod":"−1"},{"name":"Ловкость","score":15,"mod":"+2"},{"name":"Телосложение","score":15,"mod":"+2"},{"name":"Интеллект","score":10,"mod":"+0"},{"name":"Мудрость","score":12,"mod":"+1"},{"name":"Харизма","score":15,"mod":"+2"}],"columns":[[{"title":"Боевые показатели","rows":[["Класс доспеха",13],["Инициатива","+4"],["Скорость","6 клет."],["Размер","Средний"],["Максимум хитов",10],["Ячейки 1-го уровня",2],["Пассивное Восприятие",13]],"header":[],"paragraphs":["Долгий отдых возвращает все хиты, ячейки заклинаний и использования способностей."],"summary":true},{"title":"Навыки · итоговые бонусы","rows":[{"header":"Сила −1"},["●","Атлетика","+1"],{"header":"Ловкость +2"},["●","Акробатика","+4"],["●","Ловкость рук","+4"],["●","Скрытность","+4"],{"header":"Телосложение +2"},{"header":"Интеллект +0"},["●","Анализ","+2"],["","История","+0"],["","Магия","+0"],["","Природа","+0"],["","Религия","+0"],{"header":"Мудрость +1"},["●","Восприятие","+3"],["●","Выживание","+3"],["●","Проницательность","+3"],["","Медицина","+1"],["","Уход за животными","+1"],{"header":"Харизма +2"},["●","Обман","+4"],["","Выступление","+2"],["","Запугивание","+2"],["","Убеждение","+2"]],"header":[],"paragraphs":["● — владение. Навыки сгруппированы по характеристике, в заголовке группы — её модификатор. Проверка: \u003cb>d20 + указанное значение\u003c/b>, всё уже учтено."],"summary":true}],[{"title":"Атаки","rows":[["Кинжал","Ближняя; метание 4/12 клет.","d20 + ЛОВ (+2) + НАВ (+2)","1d4+2","колющий"]],"header":["Оружие","Тип атаки","Атака","Урон","Тип урона"],"paragraphs":["ЛОВ — модификатор Ловкости; СИЛ — Силы; НАВ — бонус владения этим оружием (без владения 0); МАГ — магическая прибавка. Бросьте d20 и прибавьте каждое число из формулы один раз."]},{"title":"Человек","paragraphs":["\u003cb>Находчивый.\u003c/b> После долгого отдыха получаете Героическое вдохновение. Потратьте его сразу после броска любой кости, чтобы перебросить её и использовать новый результат. Если вдохновение уже есть, новое можно передать другому персонажу игрока, у которого его нет.","\u003cb>Умелый.\u003c/b> Одно дополнительное владение навыком.","\u003cb>Гибкий.\u003c/b> Дополнительная черта происхождения."]},{"title":"Бдительный","paragraphs":["При броске инициативы прибавьте бонус владения. Эта прибавка уже учтена в боевых показателях.","Сразу после броска можно обменяться итогом инициативы с одним согласным союзником в том же бою, если оба дееспособны."]},{"title":"Характер","text":["Обожает отвечать рифмой!","Любит выступать, но в камерной обстановке. Масштабных публичных выступлений боится, поэтому всячески их избегает (если избежать не получается, перед выступлением приходится наклюкиваться)","Путешествует под прикрытием и инкогнито, ищет пропавшую сестру","Обожает милых зверушек! А, и страдает частичной потерей памяти "],"paragraphs":["\u003ci>Из-за частичной потери памяти Наэстриель совершает проверки Интеллекта (История) с помехой.\u003c/i>"]}]]},{"title":"Способности и заклинания · Наэстриель","subtitle":"Бард 1-го уровня · заговоров 2 · подготовлено 4","label":"Способности и заклинания · 1-й уровень","badge":"","columns":[[{"title":"Заклинания · краткий список","rows":[["Злая насмешка · заговор","1d6 психического урона и помеха на следующую атаку при провале спасброска Мудрости.","Действие"],["Дружба · заговор","Вы магическим образом внушаете чувство дружелюбности в одно видимое вами в пределах…","Действие"],["Волна грома · 1-й ур.","От вас исходит волна звуковой энергии в форме куба со стороной 3 клет.. Каждое существо в…","Действие"],["Героизм · 1-й ур.","Коснитесь согласного существа и наполните его отвагой. Пока действует заклинание, цель…","Действие"],["Диссонирующий шёпот · 1-й ур.","Выберите одно существо, которое видите в пределах 12 клет.. В его разуме звучит…","Действие"],["Невидимый слуга · 1-й ур.","В свободном месте на земле в пределах дистанции возникает невидимая, неразумная,…","Действие или ритуал: 10 минут (100 ходов заклинателя) и действие"]],"header":["Заклинание","Суть","Время"],"summary":true},{"title":"Использование заклинаний","paragraphs":["\u003cb>Харизма (модификатор +2) · Сл 12 · атака d20 +4.\u003c/b> Ячейки восстанавливаются после долгого отдыха. Список подготовленных заклинаний после отдыха остаётся прежним. Заговоры ячеек не расходуют.","\u003cb>Вне боя ритуал отыгрывается практически мгновенно.\u003c/b> За столом ожидание пропускается, а в игровом мире проходит указанное время сотворения.","Музыкальный инструмент служит фокусировкой заклинаний барда. При повышении уровня можно заменить один подготовленный спелл и один заговор на допустимые.","\u003cb>Компоненты:\u003c/b> Вербальный — произнесение магических слов; Соматический — жесты рукой; Материальный — указанный предмет или допустимая фокусировка. Нужны все перечисленные; материалы с указанной стоимостью и расходуемые фокусировкой не заменяются."],"summary":true},{"title":"Бардовское вдохновение","paragraphs":["\u003cb>Бонусное действие · тратит 1 использование из 2 за долгий отдых.\u003c/b> Другое существо в пределах 60 футов, которое видит или слышит вас, получает кость d6 на 1 час (600 ходов). У существа одновременно может быть только одна такая кость.","В течение этого часа после провала проверки характеристики, броска атаки или спасброска существо может бросить d6 и прибавить результат к броску d20. Кость расходуется при броске."],"cost":"использование","text":[]},{"title":"Героизм","cost":"ячейка","paragraphs":["\u003cb>Концентрация:\u003c/b> да\u003cbr>\u003cb>Основное действие · ячейка 1-го уровня.\u003c/b> Уровень 1 · Очарование\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> Касание\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический\u003cbr>\u003cb>Длительность:\u003c/b> до 1 минуты (10 ходов)","Коснитесь согласного существа и наполните его отвагой. Пока действует заклинание, цель невосприимчива к состоянию «Испуганный». В начале каждого своего хода она получает временные хиты в количестве, равном вашему модификатору заклинательной характеристики: сейчас это 2 временных хита.","Временные хиты не складываются: новое получение не прибавляется к уже имеющимся. Для поддержания заклинания требуется концентрация.","Более высокая ячейка: можно выбрать ещё одно существо за каждый уровень ячейки выше 1-го."]},{"title":"Невидимый слуга","cost":"ячейка · ритуал","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · ячейка 1-го уровня или ритуал (без ячейки).\u003c/b> Уровень 1 · Призыв\u003cbr>\u003cb>Сотворение:\u003c/b> Действие или ритуал: 10 минут (100 ходов заклинателя) и действие · \u003cb>Дистанция:\u003c/b> 60 футов\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический, Материальный (немного бечёвки и дерева)\u003cbr>\u003cb>Длительность:\u003c/b> 1 час (600 ходов)","В свободном месте на земле в пределах дистанции возникает невидимая, неразумная, бесформенная сила Среднего размера. Она существует до окончания заклинания и выполняет ваши простые поручения. У слуги КД 10, 1 хит и Сила 2. Он не может атаковать. При снижении его хитов до 0 заклинание заканчивается.","Один раз в каждый свой ход бонусным действием вы можете мысленно приказать слуге переместиться на расстояние до 3 клет. и взаимодействовать с предметом. Он способен выполнять простые дела: приносить вещи, убирать, чинить, складывать одежду, разжигать огонь, подавать еду и наливать напитки.","Получив поручение, слуга выполняет его в меру своих возможностей, затем ждёт следующей команды. Если вы прикажете выполнить задачу, которая уведёт его более чем на 12 клет. от вас, заклинание заканчивается.","\u003cb>Ритуал.\u003c/b> Ячейка не расходуется. Пока сотворяете заклинание, поддерживайте концентрацию и тратьте действие Магия каждый ход. Если концентрация прервётся, ритуал придётся начать заново. После сотворения слуга действует до 1 часа без концентрации при любом способе."]}],[{"title":"Злая насмешка","cost":"бесплатно","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · бесплатно.\u003c/b> Заговор · Очарование\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> 60 футов\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный\u003cbr>\u003cb>Длительность:\u003c/b> Мгновенно","Обратитесь с магической насмешкой к одному существу в пределах дистанции, которое вы видите или слышите. Цель совершает спасбросок Мудрости Сл 12. При провале она получает 1d6 \u003ci>психического\u003c/i> урона и помеху на следующий бросок атаки, который совершит до конца своего следующего хода.","Урон увеличивается на 1d6 на уровнях персонажа 5 (2d6), 11 (3d6) и 17 (4d6)."]},{"title":"Дружба","cost":"бесплатно","paragraphs":["\u003cb>Концентрация:\u003c/b> да\u003cbr>\u003cb>Основное действие · бесплатно.\u003c/b> Заговор · Очарование\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> 10 футов\u003cbr>\u003cb>Компоненты:\u003c/b> Соматический, Материальный (немного грима)\u003cbr>\u003cb>Длительность:\u003c/b> до 1 минуты (10 ходов)","Вы магическим образом внушаете чувство дружелюбности в одно видимое вами в пределах дистанции существо. Цель должна преуспеть в спасброске Мудрости Сл 12, иначе получит состояние Очарованный на время действия заклинания. Цель автоматически преуспевает в этом спасброске, если вы сражаетесь с ней, уже сотворяли на неё это заклинание в течение последних 24 часов или если цель не является Гуманоидом.","Заклинание заканчивается раньше, если цель получает урон или если вы совершаете бросок атаки, наносите урон или заставляете кого-либо совершить спасбросок. Когда заклинание заканчивается, цель знает, что была Очарована вами.","Очарованная цель не может атаковать вас или выбирать целью вредоносных эффектов. Вы получаете преимущество на проверки взаимодействия с ней. Это не подчинение приказам."]},{"title":"Волна грома","cost":"ячейка","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · ячейка 1-го уровня.\u003c/b> Уровень 1 · Воплощение\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> На себя, куб со стороной 15 футов\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический\u003cbr>\u003cb>Длительность:\u003c/b> Мгновенно","От вас исходит волна звуковой энергии в форме куба со стороной 3 клет.. Каждое существо в этой области совершает спасбросок Телосложения против Сл 12. При провале существо получает 2d8 урона \u003ci>звуком\u003c/i> и отталкивается от вас на 2 клет.. При успехе оно получает половину урона и не отталкивается.","Незакреплённые предметы, полностью находящиеся внутри куба, также отбрасываются на 2 клет. от вас. Громовой удар слышен в пределах 60 клет..","Более высокая ячейка: урон увеличивается на 1d8 за каждый уровень ячейки выше 1-го."]},{"title":"Диссонирующий шёпот","cost":"ячейка","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · ячейка 1-го уровня.\u003c/b> Уровень 1 · Очарование\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> 60 футов\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный\u003cbr>\u003cb>Длительность:\u003c/b> Мгновенно","Выберите одно существо, которое видите в пределах 12 клет.. В его разуме звучит диссонирующая мелодия. Цель совершает спасбросок Мудрости против Сл 12.","При провале цель получает 3d6 \u003ci>психического\u003c/i> урона и должна немедленно потратить свою реакцию, если она доступна, чтобы удалиться от вас как можно дальше наиболее безопасным путём. При успехе цель получает половину урона и не обязана перемещаться.","Более высокая ячейка: урон увеличивается на 1d6 за каждый уровень ячейки выше 1-го."]}]]},{"title":"Наэстриель · владения и снаряжение","subtitle":"","label":"Снаряжение · 1-й уровень","badge":"","columns":[[{"title":"Владения и языки","paragraphs":["Инструменты: Набор для фальсификаций, Лютня, Цимбалы, Барабан\nЯзыки: Общий, Всеобщий язык жестов, Воровской жаргон\n","Оружие: простое оружие — владение есть; воинское оружие — нет. Владение конкретным оружием видно по НАВ в формуле атаки."],"summary":true}],[{"title":"Снаряжение","paragraphs":["\u003cb>Доспех и оружие:\u003c/b> Кожаный доспех; 2 кинжала (одноручное).","\u003cb>Походное снаряжение:\u003c/b> Лютня; Набор артиста: Рюкзак, Спальник, Колокольчик, Направленный фонарь, 3 костюма, Зеркало, 8 фляг масла, Рационы на 9 дней, Трутница, Бурдюк; Предыстория: Набор для фальсификаций, костюм, отличная одежда.","Деньги на старте: 34 зм."]}]]}],"appendix":[{"title":"Наэстриель · 2-й уровень","subtitle":"Изменения к основному листу 1-го уровня","label":"Повышение уровня · 1 → 2","badge":" · 2-й уровень","columns":[[{"title":"Что изменяется","rows":[["Максимум хитов","10 → 17 (прирост 7)"],["Ячейки 1-го уровня","2 → 3"],["Подготовленные заклинания","4 → 5"]],"header":[],"paragraphs":["Прирост фиксированный; при броске вместо него — кость класса и модификатор Телосложения."],"summary":true},{"title":"Компетентность","paragraphs":["Выбранные навыки: \u003cb>Ловкость рук, Обман\u003c/b>. Бонус владения при проверках с ними удваивается. Итоговые бонусы уже включают модификаторы характеристик."]},{"title":"Мастер на все руки","paragraphs":["При проверке с навыком без владения, если PB ещё не прибавлен, добавьте половину PB с округлением вниз. Сейчас это \u003cb>1\u003c/b>. Это не владение; инициатива и спасброски не получают эту прибавку."]},{"title":"Итоговые бонусы навыков","rows":[["Выступление","+2","+3"],["Запугивание","+2","+3"],["История","+0","+1"],["Ловкость рук","+4","+6"],["Магия","+0","+1"],["Медицина","+1","+2"],["Обман","+4","+6"],["Природа","+0","+1"],["Религия","+0","+1"],["Убеждение","+2","+3"],["Уход за животными","+1","+2"]],"header":["Навык","Ур. 1","Ур. 2"],"summary":true}],[{"title":"Приказ","cost":"ячейка","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · ячейка 1-го уровня.\u003c/b> Уровень 1 · Очарование\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> 60 футов\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный\u003cbr>\u003cb>Длительность:\u003c/b> Мгновенно","Произнесите однословную команду существу, которое видите в пределах 12 клет.. Цель совершает спасбросок Мудрости против Сл 12. При провале она выполняет выбранную команду в свой следующий ход.","«Подойди»: цель движется к вам кратчайшим и наиболее прямым путём; её ход заканчивается, когда она оказывается в пределах 1 клет. от вас.","«Брось»: цель роняет всё, что держит, и заканчивает ход. «Беги»: тратит ход на удаление от вас самым быстрым доступным способом.","«Пади»: цель получает состояние «Лежащий ничком» и заканчивает ход. «Стой»: в свой ход цель не перемещается и не совершает действий или бонусных действий.","Более высокая ячейка: можно выбрать ещё одну цель за каждый уровень ячейки выше 1-го."]},{"title":"Без изменений","paragraphs":["КД, инициатива, скорость, тёмное зрение, Сл и атака магии, характеристики и число заговоров при этом переходе не меняются — смотрите основной лист."],"summary":true}]]}]}</script>
