  <script type="application/json" id="character-json">{"main":[{"title":"Неттлин","subtitle":"Шифтер (Зверолюд) · Друид 1-го уровня · Послушник","label":"Основной лист · 1-й уровень","badge":"","scores":[{"name":"Сила","score":8,"mod":"−1"},{"name":"Ловкость","score":13,"mod":"+1"},{"name":"Телосложение","score":14,"mod":"+2"},{"name":"Интеллект","score":14,"mod":"+2"},{"name":"Мудрость","score":15,"mod":"+2"},{"name":"Харизма","score":11,"mod":"+0"}],"columns":[[{"title":"Боевые показатели","rows":[["Класс доспеха",12],["Инициатива","+1"],["Скорость","6 клет."],["Тёмное зрение","12 клет."],["Размер","Маленький"],["Максимум хитов",10],["Ячейки 1-го уровня",2],["Пассивное Восприятие",14]],"header":[],"paragraphs":["Долгий отдых возвращает все хиты, ячейки заклинаний и использования способностей."],"summary":true},{"title":"Навыки · итоговые бонусы","rows":[{"header":"Сила −1"},["","Атлетика","−1"],{"header":"Ловкость +1"},["","Акробатика","+1"],["","Ловкость рук","+1"],["","Скрытность","+1"],{"header":"Телосложение +2"},{"header":"Интеллект +2"},["","Магия","+4"],["","Природа","+4"],["●","Религия","+4"],["","Анализ","+2"],["","История","+2"],{"header":"Мудрость +2"},["●","Восприятие","+4"],["●","Выживание","+4"],["●","Медицина","+4"],["●","Проницательность","+4"],["","Уход за животными","+2"],{"header":"Харизма +0"},["","Выступление","+0"],["","Запугивание","+0"],["","Обман","+0"],["","Убеждение","+0"]],"header":[],"paragraphs":["● — владение. Навыки сгруппированы по характеристике, в заголовке группы — её модификатор. Проверка: \u003cb>d20 + указанное значение\u003c/b>, всё уже учтено."],"summary":true}],[{"title":"Атаки","rows":[["Серп","Ближняя","d20 + СИЛ (−1) + НАВ (+2)","1d4−1","рубящий"],["Боевой посох","Ближняя","d20 + СИЛ (−1) + НАВ (+2)","1d6−1","дробящий"]],"header":["Оружие","Тип атаки","Атака","Урон","Тип урона"],"paragraphs":["ЛОВ — модификатор Ловкости; СИЛ — Силы; НАВ — бонус владения этим оружием (без владения 0); МАГ — магическая прибавка. Бросьте d20 и прибавьте каждое число из формулы один раз.","Боевой посох в двух руках: 1d8−1 дробящего урона. Со щитом посох держат одной рукой."]},{"title":"Шифтер · Быстроноги","paragraphs":["\u003cb>Тип:\u003c/b> Гуманоид. \u003cb>Звериные инстинкты:\u003c/b> владение выбранным навыком (Выживание). \u003cb>Тёмное зрение:\u003c/b> в тусклом свете видите как при ярком, в темноте — как при тусклом, оттенками серого.","\u003cb>Переворот · бонусное действие · тратит 1 использование из 2.\u003c/b> Принимаете звероподобный облик на 1 минуту (10 ходов) и получаете 4 временных хита (удвоенный бонус владения). Можете вернуться в обычный облик бонусным действием. Все использования восстанавливаются после долгого отдыха.","\u003cb>Быстроноги:\u003c/b> пока действует Переворот, скорость увеличивается до 8 клет. Когда существо заканчивает ход в 1 клет. от вас, можете реакцией переместиться на расстояние до 2 клет. Это перемещение не провоцирует атаки."],"text":[],"cost":"использование"},{"title":"Характер","text":["Прежде чем сесть, спрашивает у стула, не занят ли он. Если стул скрипит, герой извиняется и ищет другой.","Хочет накопить на собственную таверну, где путника не выгонят на улицу в бурю.","Переписывал описи в храме Огмы и привык уточнять, кто что видел собственными глазами.","Теряется, когда два человека, которым он доверяет, рассказывают разные версии событий."],"paragraphs":["\u003ci>Когда двое людей, которым Неттлин доверяет, рассказывают разные версии, она совершает с помехой проверку Проницательности, чтобы понять, кто скрывает правду.\u003c/i>"]}]]},{"title":"Способности и заклинания · Неттлин","subtitle":"Друид 1-го уровня · заговоров 3 · подготовлено 4","label":"Способности и заклинания · 1-й уровень","badge":"","columns":[[{"title":"Заклинания · краткий список","rows":[["Починка · заговор","Чинит один небольшой сломанный предмет","1 минута"],["Стихийная магия · заговор","Малый эффект воздуха, земли, огня или воды","Действие"],["Ядовитые брызги · заговор","Дальнобойная атака: 1d12 урона ядом","Действие"],["Дружба с животными · 1-й ур.","Зверь: спасбросок Мудрости Сл 12 или Очарован","Действие"],["Лечащее слово · 1-й ур.","Видимая цель восстанавливает хиты","Бонусное действие"],["Облако тумана · 1-й ур.","Туман радиусом 4 клет. сильно заслоняет область до 1 часа. Требуется концентрация.","Действие"],["Обнаружение магии · 1-й ур.","Ощущает магические эффекты в радиусе 6 клеток","Действие или ритуал (на 10 минут дольше)"]],"header":["Заклинание","Суть","Время"],"summary":true},{"title":"Использование заклинаний","paragraphs":["\u003cb>Мудрость (модификатор +2) · Сл 12 · атака d20 +4.\u003c/b> Ячейки восстанавливаются после долгого отдыха. Список подготовленных заклинаний после отдыха остаётся прежним. Заговоры ячеек не расходуют.","\u003cb>Вне боя ритуал отыгрывается практически мгновенно.\u003c/b> За столом ожидание пропускается, а в игровом мире проходит указанное время сотворения.","Друидическая фокусировка заменяет недорогие материальные компоненты. Подготовленное заклинание с пометкой «Ритуал» можно сотворить без ячейки, добавив 10 минут к обычному времени сотворения. При получении уровня друида можно заменить один заговор друида другим из его списка.","\u003cb>Компоненты:\u003c/b> Вербальный — произнесение магических слов; Соматический — жесты рукой; Материальный — указанный предмет или допустимая фокусировка. Нужны все перечисленные; материалы с указанной стоимостью и расходуемые фокусировкой не заменяются."],"summary":true},{"title":"Первобытный орден · Ведун","paragraphs":["\u003cb>Пассивно · без затрат.\u003c/b> Один дополнительный заговор друида. К проверкам Интеллекта (Магия или Природа) добавляется модификатор Мудрости (минимум +1). Прибавка уже включена в таблицу навыков."]},{"title":"Дружба с животными","cost":"ячейка","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · ячейка 1-го уровня.\u003c/b> Уровень 1 · Очарование\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> 30 футов\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический, Материальный (кусочек пищи)\u003cbr>\u003cb>Длительность:\u003c/b> 24 часа","Выберите видимого зверя в пределах дистанции. При провале спасброска Мудрости \u003cb>Сл 12\u003c/b> он становится Очарованным на 24 часа. Очарованный не может атаковать очаровавшего или выбирать его целью наносящих урон эффектов. Очаровавший имеет преимущество на проверки социального взаимодействия с целью. Если вы или союзник нанесёте зверю урон, заклинание закончится.","За каждый уровень ячейки выше 1-го можно выбрать ещё одного зверя."]},{"title":"Обнаружение магии","cost":"ячейка · ритуал","paragraphs":["\u003cb>Концентрация:\u003c/b> да\u003cbr>\u003cb>Основное действие · ячейка 1-го уровня или ритуал (без ячейки).\u003c/b> Уровень 1 · Прорицание · Ритуал\u003cbr>\u003cb>Сотворение:\u003c/b> Действие или ритуал (на 10 минут дольше) · \u003cb>Дистанция:\u003c/b> На себя\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический\u003cbr>\u003cb>Длительность:\u003c/b> до 10 минут (100 ходов)","Ощущаете магические эффекты в пределах 30 футов. Если обнаружили эффект, действием Магия можете увидеть слабую ауру вокруг видимого существа или предмета, на котором он находится. Если эффект создан заклинанием, узнаёте его школу.","Эффект блокируют 1 фут камня, земли или дерева, 1 дюйм металла либо тонкий лист свинца."]}],[{"title":"Починка","cost":"бесплатно","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Вне боя · бесплатно.\u003c/b> Заговор · Преобразование\u003cbr>\u003cb>Сотворение:\u003c/b> 1 минута · \u003cb>Дистанция:\u003c/b> Касание\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический, Материальный (два куска магнетита)\u003cbr>\u003cb>Длительность:\u003c/b> Мгновенно","Устраняет один разрыв или поломку предмета, которого вы касаетесь: например, звено цепи, сломанный ключ, разрыв ткани или протекающий бурдюк. Повреждение должно быть не больше \u003cb>0.2 клетки в каждом измерении\u003c/b>. После починки следов поломки не остаётся.","Может восстановить физическую целостность магического предмета, но \u003cb>не возвращает его утраченную магию\u003c/b>."]},{"title":"Стихийная магия","cost":"бесплатно","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · бесплатно.\u003c/b> Заговор · Преобразование\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> 30 футов\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический\u003cbr>\u003cb>Длительность:\u003c/b> Мгновенно","Выберите один эффект в пределах дистанции. \u003cb>Воздух:\u003c/b> порыв в кубе со стороной 5 футов шевелит ткань, пыль и листву, захлопывает открытые двери и ставни, если их ничто не держит. \u003cb>Земля:\u003c/b> покройте поверхности тонким слоем песка или пыли на площади 5 × 5 футов либо напишите одно слово на земле или песке.","\u003cb>Огонь:\u003c/b> в кубе со стороной 5 футов появляются безвредные искры и цветной ароматный дым. Искры могут зажечь свечи, факелы или лампы, запах держится 1 минуту. \u003cb>Вода:\u003c/b> прохладный туман слегка смачивает всё в таком же кубе либо создаёт чашку чистой воды на поверхности или в открытой ёмкости. Вода испаряется через 1 минуту.","\u003cb>Лепка:\u003c/b> придайте земле, песку, пламени, дыму, туману или воде объёмом до куба со стороной 1 фут грубую форму на 1 час."]},{"title":"Ядовитые брызги","cost":"бесплатно","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · бесплатно.\u003c/b> Заговор · Некромантия\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> 30 футов\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический\u003cbr>\u003cb>Длительность:\u003c/b> Мгновенно","Совершите дальнобойную атаку заклинанием \u003cb>+4\u003c/b> по существу в пределах дистанции. При попадании цель получает 1d12 урона \u003ci>ядом\u003c/i>. На уровнях 5, 11 и 17 урон увеличивается до 2d12, 3d12 и 4d12 соответственно."]},{"title":"Лечащее слово","cost":"ячейка","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Бонусное действие · ячейка 1-го уровня.\u003c/b> Уровень 1 · Ограждение\u003cbr>\u003cb>Сотворение:\u003c/b> Бонусное действие · \u003cb>Дистанция:\u003c/b> 60 футов\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный\u003cbr>\u003cb>Длительность:\u003c/b> Мгновенно","Выберите видимое существо в пределах дистанции. Оно восстанавливает \u003cb>2d4 + 2\u003c/b> хитов. За каждый уровень ячейки выше 1-го восстановление увеличивается на 2d4."]},{"title":"Облако тумана","cost":"ячейка","paragraphs":["\u003cb>Концентрация:\u003c/b> да\u003cbr>\u003cb>Основное действие · ячейка 1-го уровня.\u003c/b> Уровень 1 · Призыв\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> 120 футов\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический\u003cbr>\u003cb>Длительность:\u003c/b> до 1 часа (600 ходов)","Создайте \u003cb>сферу тумана радиусом 20 футов\u003c/b>; её область считается \u003cb>сильно заслонённой\u003c/b>. Сильный ветер рассеивает туман.","За каждый уровень ячейки выше 1-го радиус увеличивается на 20 футов."]}]]},{"title":"Магия послушника · Неттлин","subtitle":"","label":"Происхождение · 1-й уровень","badge":"","columns":[[{"title":"Посвящённый в магию · Жрец","paragraphs":["\u003cb>Послушник.\u003c/b> Два заговора жреца и одно всегда подготовленное заклинание 1-го уровня. Заклинательная характеристика — Мудрость, Сл 12. Заговоры и заклинание черты учитываются отдельно от списка друида.","Выбранное заклинание 1-го уровня можно сотворить один раз без ячейки с восстановлением после долгого отдыха. Его также можно сотворять имеющимися ячейками. Бесплатное сотворение всё равно требует указанных компонентов."]},{"title":"Наставление","cost":"бесплатно","paragraphs":["\u003cb>Концентрация:\u003c/b> да\u003cbr>\u003cb>Основное действие · бесплатно.\u003c/b> Заговор · Прорицание\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> Касание\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический\u003cbr>\u003cb>Длительность:\u003c/b> до 1 минуты (10 ходов)","Коснитесь согласного существа и выберите один навык. Пока действует заклинание, цель добавляет \u003cb>1d4 к каждой проверке характеристики, использующей этот навык\u003c/b>. На атаки, спасброски и проверки других навыков эта прибавка не действует. Вы можете выбрать себя.","Одновременно поддерживается только одно заклинание с концентрацией."]},{"title":"Слово сияния","cost":"бесплатно","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · бесплатно.\u003c/b> Заговор · Воплощение\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> На себя (эманация 5 футов)\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Материальный (жетон с изображением солнечных лучей)\u003cbr>\u003cb>Длительность:\u003c/b> Мгновенно","Каждое выбранное вами видимое существо в пределах эманации совершает спасбросок Телосложения \u003cb>Сл 12\u003c/b>. При провале оно получает 1d6 урона \u003ci>излучением\u003c/i>. На уровнях 5, 11 и 17 урон увеличивается до 2d6, 3d6 и 4d6."]}],[{"title":"Благословение","cost":"бесплатно","paragraphs":["\u003cb>Концентрация:\u003c/b> да\u003cbr>\u003cb>Основное действие · бесплатно.\u003c/b> Уровень 1 · Очарование\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> 30 футов\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический, Материальный (священный символ стоимостью не менее 5 зм)\u003cbr>\u003cb>Длительность:\u003c/b> до 1 минуты (10 ходов)","Выберите до трёх существ в пределах дистанции. До окончания заклинания каждое прибавляет 1d4 ко всем своим броскам атаки и спасброскам.","За каждый уровень ячейки выше 1-го можно выбрать ещё одно существо. Священный символ из снаряжения подходит, если стоит не менее 5 зм."]}]]},{"title":"Неттлин · владения и снаряжение","subtitle":"","label":"Снаряжение · 1-й уровень","badge":"","columns":[[{"title":"Владения и языки","paragraphs":["Инструменты: Инструменты каллиграфа, Набор травника\nЯзыки: Общий, Друидический, Сильван\n","Доспехи: лёгкие доспехи и щиты.","Оружие: простое оружие — владение есть; воинское оружие — нет. Владение конкретным оружием видно по НАВ в формуле атаки."],"summary":true},{"title":"Снаряжение","paragraphs":["\u003cb>Доспех и оружие:\u003c/b> Кожаный доспех; Щит; Серп (одноручное); Друидическая фокусировка: боевой посох (универсальное, в одной или двух руках).","\u003cb>Походное снаряжение:\u003c/b> Набор путешественника: Рюкзак, Спальник, 2 фляги масла, Рационы на 10 дней, Верёвка, Трутница, 10 факелов, Бурдюк; Набор травника; Личное: Амулет с зелёным самоцветом.","\u003cb>Инструменты:\u003c/b> Предыстория: Инструменты каллиграфа, молитвенник, священный символ, 10 листов пергамента, облачение.","Деньги на старте: 17 зм."]}],[{"title":"Друидический язык","paragraphs":["\u003cb>Пассивно · без затрат.\u003c/b> Можете оставлять скрытые сообщения на друидическом языке. Знающие язык замечают их автоматически. Остальным для обнаружения нужна проверка Интеллекта (Анализ) Сл 15. Без магии они не могут расшифровать сообщение.","«Разговор с животными» всегда подготовлен и не занимает место в списке подготовленных заклинаний друида."]},{"title":"Разговор с животными","cost":"бесплатно ритуалом","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · ячейка 1-го уровня или ритуал (без ячейки).\u003c/b> Уровень 1 · Прорицание · Ритуал\u003cbr>\u003cb>Сотворение:\u003c/b> Действие или ритуал (на 10 минут дольше) · \u003cb>Дистанция:\u003c/b> На себя\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический\u003cbr>\u003cb>Длительность:\u003c/b> 10 минут (100 ходов)","Понимаете зверей и можете с ними разговаривать. При действии Влияние доступны все его варианты навыков. Зверь может рассказать о ближайших местах и существах, включая то, что заметил за последние сутки."]}]]}],"appendix":[{"title":"Неттлин · 2-й уровень","subtitle":"Изменения к основному листу 1-го уровня","label":"Повышение уровня · 1 → 2","badge":" · 2-й уровень","columns":[[{"title":"Что изменяется","rows":[["Максимум хитов","10 → 17 (прирост 7)"],["Ячейки 1-го уровня","2 → 3"],["Подготовленные заклинания","4 → 5"]],"header":[],"paragraphs":["Прирост фиксированный; при броске вместо него — кость класса и модификатор Телосложения."],"summary":true}],[{"title":"Скороход","cost":"ячейка","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · ячейка 1-го уровня.\u003c/b> Уровень 1 · Преобразование\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> Касание\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический, Материальный (щепотка земли)\u003cbr>\u003cb>Длительность:\u003c/b> 1 час (600 ходов)","Скорость существа, которого вы касаетесь, увеличивается на \u003cb>10 футов\u003c/b> до окончания заклинания. Ваша скорость под его действием — \u003cb>8 клет.\u003c/b> Концентрация не требуется.","За каждый уровень ячейки выше 1-го можно выбрать ещё одно существо."]},{"title":"Без изменений","paragraphs":["КД, инициатива, скорость, тёмное зрение, Сл и атака магии, характеристики и число заговоров при этом переходе не меняются — смотрите основной лист."],"summary":true}]]},{"title":"Неттлин · Дикий облик и спутник","subtitle":"Классовые способности друида","label":"Повышение уровня · 2-й уровень","badge":" · 2-й уровень","columns":[[{"title":"Дикий облик","paragraphs":["\u003cb>Бонусное действие · тратит 1 использование из 2.\u003c/b> Превратитесь в известного зверя на 1 час (600 ходов) и получите 2 временных хита. Все использования восстанавливаются после долгого отдыха. Облик заканчивается при повторном использовании, состоянии «Недееспособный», смерти или добровольном возвращении бонусным действием.","\u003cb>Известные облики:\u003c/b> Кошка, Пантера, Гигантский огненный жук, Ядовитая змея. Можно знать четыре облика зверей с опасностью до 1/4 без скорости полёта. После долгого отдыха можно заменить один облик другим подходящим.","Используйте показатели зверя, сохраняя тип существа, хиты, Интеллект, Мудрость, Харизму, личность, память, речь, языки, классовые особенности, черты и свои владения навыками и спасбросками. Получаете также владения зверя. Если его бонус к навыку или спасброску выше вашего, используйте его.","В облике нельзя сотворять заклинания, но можно поддерживать концентрацию. Обращение с предметами зависит от анатомии зверя. Снаряжение можно оставить на земле, слить с обликом или носить, если оно подходит. Слившееся с обликом снаряжение не действует."],"text":[],"cost":"использование"}],[{"title":"Дикий спутник","paragraphs":["\u003cb>Концентрация:\u003c/b> нет. \u003cb>Основное действие (Магия) · ячейка или 1 использование Дикого облика.\u003c/b> Сотворите «Обретение фамильяра» без материальных компонентов. Фамильяр — Фея в зверином облике, исчезает после вашего долгого отдыха.","Фамильяр появляется в свободном месте в пределах 2 клет. в облике зверя с опасностью 0. Он действует по собственной инициативе, выполняет ваши команды и не может атаковать. В пределах 20 клет. с ним можно общаться телепатически. Бонусным действием можно видеть и слышать его чувствами до начала вашего следующего хода. Он может реакцией передать заклинание с дистанцией «Касание», если находится в пределах 20 клет. от вас.","При 0 хитов фамильяр исчезает. Действием Магия его можно отпустить или временно убрать в карманное измерение и таким же действием вернуть в свободное место в пределах 6 клет. При исчезновении он оставляет снаряжение. У вас может быть только один фамильяр. Повторное сотворение позволяет сменить его облик."],"cost":"ячейка · использование"}]]}]}</script>
