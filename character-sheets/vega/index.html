  <script type="application/json" id="character-json">{"main":[{"title":"Вега","subtitle":"Гном · Изобретатель 1-го уровня · Ремесленник","label":"Основной лист · 1-й уровень","badge":"","scores":[{"name":"Сила","score":8,"mod":"−1"},{"name":"Ловкость","score":16,"mod":"+3"},{"name":"Телосложение","score":13,"mod":"+1"},{"name":"Интеллект","score":16,"mod":"+3"},{"name":"Мудрость","score":12,"mod":"+1"},{"name":"Харизма","score":10,"mod":"+0"}],"columns":[[{"title":"Боевые показатели","rows":[["Класс доспеха",15],["Инициатива","+3"],["Скорость","6 клет."],["Тёмное зрение","12 клет."],["Размер","Маленький"],["Максимум хитов",9],["Ячейки 1-го уровня",2],["Пассивное Восприятие",11]],"header":[],"paragraphs":["Долгий отдых возвращает все хиты, ячейки заклинаний и использования способностей."],"summary":true},{"title":"Навыки · итоговые бонусы","rows":[{"header":"Сила −1"},["","Атлетика","−1"],{"header":"Ловкость +3"},["●","Ловкость рук","+5"],["","Акробатика","+3"],["","Скрытность","+3"],{"header":"Телосложение +1"},{"header":"Интеллект +3"},["●","Анализ","+5"],["●","Магия","+5"],["","История","+3"],["","Природа","+3"],["","Религия","+3"],{"header":"Мудрость +1"},["","Восприятие","+1"],["","Выживание","+1"],["","Медицина","+1"],["","Проницательность","+1"],["","Уход за животными","+1"],{"header":"Харизма +0"},["●","Убеждение","+2"],["","Выступление","+0"],["","Запугивание","+0"],["","Обман","+0"]],"header":[],"paragraphs":["● — владение. Навыки сгруппированы по характеристике, в заголовке группы — её модификатор. Проверка: \u003cb>d20 + указанное значение\u003c/b>, всё уже учтено."],"summary":true}],[{"title":"Атаки","rows":[["Кинжал","Ближняя; метание 4/12 клет.","d20 + ЛОВ (+3) + НАВ (+2)","1d4+3","колющий"],["Лёгкий арбалет","Дальнобойная (16/64 клет.)","d20 + ЛОВ (+3) + НАВ (+2)","1d8+3","колющий"]],"header":["Оружие","Тип атаки","Атака","Урон","Тип урона"],"paragraphs":["ЛОВ — модификатор Ловкости; СИЛ — Силы; НАВ — бонус владения этим оружием (без владения 0); МАГ — магическая прибавка. Бросьте d20 и прибавьте каждое число из формулы один раз."]},{"title":"Скальный гном","paragraphs":["\u003cb>Тёмное зрение\u003c/b> (число — в боевых показателях): в тусклом свете видите как при ярком, в темноте — как при тусклом, оттенками серого.","\u003cb>Гномья хитрость:\u003c/b> преимущество на все спасброски Интеллекта, Мудрости и Харизмы.","\u003cb>Заводное устройство:\u003c/b> 10 минут (100 ходов) сотворения Фокусов, Крошечное устройство с КД 5 и 1 хитом. Выберите один конкретный эффект Фокусов. Любое существо активирует его бонусным действием с касанием. Не более трёх устройств одновременно; каждое распадается через 8 часов либо при разборке касанием с действием Использование."],"text":[]},{"title":"Происхождение · Мастеровой","paragraphs":["\u003cb>Ремесленник.\u003c/b> Скидка 20% на немагические покупки. После долгого отдыха можно изготовить один предмет, распадающийся после следующего отдыха; инструменты должны быть у вас и освоены."]},{"title":"Характер","text":["Верит, что может изобрести несуществующие вещи.","Исследование и новые открытия.","Всю жизнь работал плотником, но потом решил отправиться в путешествие.","Боится пауков и существ с большим числом конечностей."],"paragraphs":["\u003ci>При их виде Вега получает состояние «Испуганный». Пока источник страха находится в пределах прямой видимости, проверки характеристик и броски атаки совершаются с помехой. Нельзя добровольно приближаться к источнику страха. Состояние само по себе не уменьшает Ловкость, КД, скорость или числовые бонусы.\u003c/i>"]}]]},{"title":"Способности и заклинания · Вега","subtitle":"Изобретатель 1-го уровня · заговоров 4 · подготовлено 2","label":"Способности и заклинания · 1-й уровень","badge":"","columns":[[{"title":"Заклинания · краткий список","rows":[["Луч холода · заговор","Дальнобойная атака: 1d8 урона холодом и −10 футов скорости цели до вашего следующего хода","Действие"],["Наставление · заговор","Касание: союзник получает +1d4 к проверкам одного навыка","Действие"],["Починка · заговор","Чинит один небольшой сломанный предмет","1 минута"],["Фокусы · заговор","Мелкие магические эффекты: искры, звуки, запахи, огонь, чистка, метка","Действие"],["Опознание · 1-й ур.","Раскрывает свойства магического предмета или действующие на существе заклинания; ритуал","1 минута"],["Скороход · 1-й ур.","Скорость цели +10 футов на 1 час","Действие"]],"header":["Заклинание","Суть","Время"],"summary":true},{"title":"Использование заклинаний","paragraphs":["\u003cb>Интеллект (модификатор +3) · Сл 13 · атака d20 +5.\u003c/b> Ячейки восстанавливаются после долгого отдыха. Список подготовленных заклинаний после отдыха остаётся прежним. Заговоры ячеек не расходуют.","\u003cb>Вне боя ритуал отыгрывается практически мгновенно.\u003c/b> За столом ожидание пропускается, а в игровом мире проходит указанное время сотворения.","Держите в руке воровские инструменты, инструменты ремонтника или освоенные ремесленные инструменты: это обязательная материальная фокусировка классовых заклинаний. Дорогие и расходуемые материалы всё равно нужны. После долгого отдыха можно заменить один классовый заговор.","\u003cb>Компоненты:\u003c/b> Вербальный — произнесение магических слов; Соматический — жесты рукой; Материальный — указанный предмет или допустимая фокусировка. Нужны все перечисленные; материалы с указанной стоимостью и расходуемые фокусировкой не заменяются."],"summary":true},{"title":"Магия вещей","paragraphs":["\u003cb>Основное действие (действие Магия) · тратит 1 использование из 3 за долгий отдых.\u003c/b> Инструменты ремонтника в руке. Создайте один разрешённый обычный предмет в свободном месте в пределах 5 футов. Он существует до вашего следующего долгого отдыха.","Блок и лебёдка, кувшин, свеча, бумага, лампа, сеть, ведро, леска, спальник, верёвка, ломик, бутылка, шипы, лопата, трутница, калтропы, масло, факел, кандалы, металлические шарики, флакон, колокольчик, мешок, фляга, корзина, одеяло, шест, кошель, капкан, крюк-кошка, пергамент."],"cost":"использование","text":[]},{"title":"Опознание","cost":"ячейка · ритуал","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Вне боя · ячейка 1-го уровня или ритуал (без ячейки).\u003c/b> Уровень 1 · Прорицание · Ритуал\u003cbr>\u003cb>Сотворение:\u003c/b> 1 минута; ритуал — 11 минут · \u003cb>Дистанция:\u003c/b> Касание\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический, Материальный (жемчужина стоимостью не менее 100 зм)\u003cbr>\u003cb>Длительность:\u003c/b> Мгновенно","Всё время сотворения касайтесь предмета. Если он магический, вы узнаёте его свойства, способ использования, необходимость настройки и количество зарядов. Вы также узнаёте, какие действующие заклинания влияют на предмет; если предмет создан заклинанием — его название.","Вместо предмета можно касаться существа: тогда вы узнаете, какие заклинания сейчас на нём действуют.","\u003cb>Жемчужина не расходуется, но обязательна:\u003c/b> инструменты-фокусировка не заменяют материал с указанной стоимостью. Проверьте, что записанная жемчужина стоит не менее 100 зм. Ритуал не расходует ячейку."]}],[{"title":"Луч холода","cost":"бесплатно","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · бесплатно.\u003c/b> Заговор · Воплощение\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> 60 футов\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический\u003cbr>\u003cb>Длительность:\u003c/b> Мгновенно","Совершите дальнобойную атаку заклинанием \u003cb>+5\u003c/b> по одному существу. При попадании оно получает \u003cb>1d8 урона \u003ci>холодом\u003c/i>\u003c/b>, а его скорость уменьшается на 10 футов до начала вашего следующего хода.","Урон увеличивается на 1d8 при достижении уровней персонажа 5 (2d8), 11 (3d8) и 17 (4d8). Модификатор Интеллекта к этому урону не прибавляется."]},{"title":"Наставление","cost":"бесплатно","paragraphs":["\u003cb>Концентрация:\u003c/b> да\u003cbr>\u003cb>Основное действие · бесплатно.\u003c/b> Заговор · Прорицание\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> Касание\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический\u003cbr>\u003cb>Длительность:\u003c/b> до 1 минуты (10 ходов)","Коснитесь согласного существа и выберите один навык. Пока действует заклинание, цель добавляет \u003cb>1d4 к каждой проверке характеристики, использующей этот навык\u003c/b>. На атаки, спасброски и проверки других навыков эта прибавка не действует. Вы можете выбрать себя.","Одновременно поддерживается только одно заклинание с концентрацией."]},{"title":"Починка","cost":"бесплатно","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Вне боя · бесплатно.\u003c/b> Заговор · Преобразование\u003cbr>\u003cb>Сотворение:\u003c/b> 1 минута · \u003cb>Дистанция:\u003c/b> Касание\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический, Материальный (два куска магнетита)\u003cbr>\u003cb>Длительность:\u003c/b> Мгновенно","Устраняет один разрыв или поломку предмета, которого вы касаетесь: например, звено цепи, сломанный ключ, разрыв ткани или протекающий бурдюк. Повреждение должно быть не больше \u003cb>0.2 клетки в каждом измерении\u003c/b>. После починки следов поломки не остаётся.","Может восстановить физическую целостность магического предмета, но \u003cb>не возвращает его утраченную магию\u003c/b>."]},{"title":"Фокусы","cost":"бесплатно","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · бесплатно.\u003c/b> Заговор · Преобразование\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> 10 футов\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический\u003cbr>\u003cb>Длительность:\u003c/b> До 1 часа (600 ходов)","Выберите один эффект в пределах дистанции. Одновременно могут действовать до трёх ваших немгновенных эффектов этого заговора.","\u003cb>Ощущение:\u003c/b> мгновенный безвредный эффект — искры, лёгкий ветер, тихие музыкальные звуки или запах. \u003cb>Огонь:\u003c/b> мгновенно зажечь или погасить свечу, факел либо небольшой костёр.","\u003cb>Чистота:\u003c/b> мгновенно очистить или испачкать предмет объёмом до 28 л. \u003cb>Температура и вкус:\u003c/b> охладить, нагреть или придать вкус до 28 л неживого вещества на 1 час.","\u003cb>Метка:\u003c/b> цвет, небольшой знак или символ на предмете/поверхности на 1 час. \u003cb>Малая вещь:\u003c/b> немагическая безделушка или иллюзорное изображение, помещающееся в ладони, до конца вашего следующего хода. Безделушка не имеет денежной ценности и не наносит урон.","Объём 28 л указан округлённо; площади и объёмы не являются дистанцией в клетках."]},{"title":"Скороход","cost":"ячейка","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Основное действие · ячейка 1-го уровня.\u003c/b> Уровень 1 · Преобразование\u003cbr>\u003cb>Сотворение:\u003c/b> Действие · \u003cb>Дистанция:\u003c/b> Касание\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический, Материальный (щепотка земли)\u003cbr>\u003cb>Длительность:\u003c/b> 1 час (600 ходов)","Скорость существа, которого вы касаетесь, увеличивается на \u003cb>10 футов\u003c/b> до окончания заклинания. Ваша скорость под его действием — \u003cb>8 клет.\u003c/b> Концентрация не требуется.","За каждый уровень ячейки выше 1-го можно выбрать ещё одно существо."]}]]},{"title":"Вега · владения и снаряжение","subtitle":"","label":"Снаряжение · 1-й уровень","badge":"","columns":[[{"title":"Владения и языки","paragraphs":["Инструменты: Воровские инструменты, Инструменты ремонтника, Инструменты плотника, Инструменты резчика по дереву, Инструменты каменщика, Инструменты алхимика, Инструменты кузнеца\nЯзыки: Общий, Гномий, Дварфийский\n","Оружие: простое оружие — владение есть; воинское оружие — нет. Владение конкретным оружием видно по НАВ в формуле атаки."],"summary":true},{"title":"Снаряжение","paragraphs":["\u003cb>Доспех и оружие:\u003c/b> Проклёпанный кожаный доспех; 2 кинжала (одноручное); Лёгкий арбалет (двуручное), 20 болтов.","\u003cb>Инструменты:\u003c/b> Воровские инструменты; Инструменты ремонтника.","\u003cb>Походное снаряжение:\u003c/b> Набор исследователя подземелий: рюкзак, ломик, молоток, 10 крюков, 10 факелов, трутница, рационы на 10 дней, бурдюк, верёвка 10 клет.; Жемчужина (100 зм).","Деньги на старте: 48 зм."]}],[{"title":"Быстрое изготовление · освоенные наборы","rows":[["Плотника","Лестница, факел"],["Резчика","Дубинка, палица, посох"],["Каменщика","Блок и лебёдка"],["Кузнеца","Шарики, ведро, калтропы, крюк, котёл"],["Ремонтника","Колокольчик, лопата, трутница"]],"header":[]}]]}],"appendix":[{"title":"Вега · 2-й уровень","subtitle":"Изменения к основному листу 1-го уровня","label":"Повышение уровня · 1 → 2","badge":" · 2-й уровень","columns":[[{"title":"Что изменяется","rows":[["Максимум хитов","9 → 15 (прирост 6)"],["Ячейки 1-го уровня","2 → 2"],["Подготовленные заклинания","2 → 3"]],"header":[],"paragraphs":["Прирост фиксированный; при броске вместо него — кость класса и модификатор Телосложения."],"summary":true},{"title":"Реплики магических предметов","paragraphs":["Известно \u003cb>4\u003c/b> схем; одновременно поддерживаются до двух реплик. По окончании долгого отдыха с инструментами ремонтника создайте до двух разных предметов по известным схемам. При необходимости настройка возможна сразу при создании. При превышении лимита исчезает старейший предмет.","Известные схемы: Оружие повторного выстрела; Многообразный инструмент; Алхимический сосуд; Сумка хранения. Сейчас созданы: \u003cb>Многообразный инструмент; Алхимический сосуд\u003c/b>. Известная схема не означает, что её реплика уже создана."]}],[{"title":"Убежище","cost":"ячейка","paragraphs":["\u003cb>Концентрация:\u003c/b> нет\u003cbr>\u003cb>Бонусное действие · ячейка 1-го уровня.\u003c/b> Уровень 1 · Ограждение\u003cbr>\u003cb>Сотворение:\u003c/b> Бонусное действие · \u003cb>Дистанция:\u003c/b> 30 футов\u003cbr>\u003cb>Компоненты:\u003c/b> Вербальный, Соматический, Материальный (осколок зеркала)\u003cbr>\u003cb>Длительность:\u003c/b> 1 минута (10 ходов)","Защитите одно существо в пределах дистанции. Любое существо, которое выбирает защищённую цель для броска атаки или наносящего урон заклинания, должно пройти \u003cb>спасбросок Мудрости Сл 13\u003c/b>. При провале оно выбирает другую цель либо теряет эту атаку или заклинание.","Защита \u003cb>не действует против эффектов по области\u003c/b>. Заклинание заканчивается, если защищённая цель совершает бросок атаки, сотворяет заклинание или наносит урон. Концентрация не требуется."]},{"title":"Без изменений","paragraphs":["КД, инициатива, скорость, тёмное зрение, Сл и атака магии, характеристики и число заговоров при этом переходе не меняются — смотрите основной лист."],"summary":true}]]},{"title":"Вега · схемы и предметы","subtitle":"Возможности второго уровня","label":"Справочник реплик · 2-й уровень","badge":" · 2-й уровень","columns":[[{"paragraphs":["Требует настройки; оружие с боеприпасами получает \u003cb>+1 к дальнобойным атакам и урону\u003c/b>, игнорирует свойство перезарядки и само создаёт магический боеприпас, если оружие не заряжено. Такой боеприпас исчезает после попадания или промаха."],"text":[],"title":"Оружие повторного выстрела · только схема"},{"paragraphs":["Необычный чудесный предмет, без настройки. Действием назовите жидкость из таблицы. Затем отдельным действием откройте сосуд и выливайте выбранную жидкость, не быстрее \u003cb>7,6 л в минуту\u003c/b>.","До следующего рассвета нельзя выбрать другую жидкость или превысить её суточный предел. Количества в таблице переведены в метрические единицы и округлены."],"rows":[["Кислота","≈237 мл"],["Простой яд","≈15 мл"],["Пиво","≈15,1 л"],["Мёд","≈3,8 л"],["Майонез","≈7,6 л"],["Масло","≈0,95 л"],["Уксус","≈7,6 л"],["Пресная вода","≈30,3 л"],["Солёная вода","≈45,4 л"],["Вино","≈3,8 л"]],"header":["Жидкость","Максимум"],"text":[],"title":"Алхимический сосуд · создан"}],[{"paragraphs":["Обычный чудесный предмет; \u003cb>требуется настройка\u003c/b>. Действием Магия коснитесь его и превратите в выбранный вид ремесленных инструментов. При использовании полученной формы вы владеете ею.","Это не «Всеобъемлющий инструмент +1»: бонус +1 к Сл и атакам заклинаний он не даёт. Он также не заменяет воровские инструменты произвольным превращением."],"text":[],"title":"Многообразный инструмент · создан"},{"paragraphs":["Вместимость: \u003cb>до 227 кг и 1,81 м³\u003c/b>; сама весит около 2,3 кг независимо от содержимого. Достать предмет — действие Использование.","При перегрузке, проколе или разрыве сумка уничтожается, вещи рассеиваются в Астрале. Вывернутая сумка высыпает содержимое; для работы её нужно вернуть в обычный вид. Воздуха хватает на 10 минут (100 ходов), делённых на число дышащих существ внутри.","Вложение в другое аналогичное межпространственное хранилище уничтожает оба предмета и открывает односторонний разрыв в Астрал: затягиваются существа в радиусе 10 футов."],"text":[],"title":"Сумка хранения · только схема"}]]}]}</script>
