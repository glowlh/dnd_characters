<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="192x192" href="./assets/icon-192.png?v=2">
  <meta name="apple-mobile-web-app-title" content="DnD Chars">
  <script defer src="./pwa.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DnD Chars</title>
  <script src="character-sheets/theme.js"></script>
  <link rel="stylesheet" href="character-sheets/styles.css">
  <style>
    body {
      margin: 0;
      background: #f6f2eb;
      color: #29231e;
      font: 1rem/1.5 system-ui, sans-serif;
    }

    main {
      box-sizing: content-box;
      max-width: 42rem;
      margin: 0 auto;
      padding: clamp(2rem, 8vw, 5rem) 1rem;
    }

    h1, h2 {
      line-height: 1.2;
    }

    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3rem); }
    h2 { margin: 0; font-size: 1.5rem; }
    header { margin: 0; }
    header p { margin: 0.5rem 0 1.5rem; }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.75rem;
      margin-bottom: 1.5rem;
    }

    .quick-links a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      min-height: 44px;
      padding: 0 0.65rem;
      border: 1px solid currentColor;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      text-decoration: none;
    }

    .quick-links a:hover { background: #8882; }
    .quick-links :is(svg, img) { flex: none; width: 1.2rem; height: 1.2rem; }
    [data-theme="dark"] .quick-links img { filter: grayscale(1) invert(1) brightness(1.35); }

    .characters {
      display: grid;
      gap: 0.75rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .character {
      padding: 1rem 1.25rem;
      border: 1px solid #ded4c5;
      border-radius: 0.5rem;
      background: #fffdf8;
    }

    .character-class { margin: 0.25rem 0 0.5rem; color: #656565; }

    a { color: #832e24; text-underline-offset: 0.18em; }
    a:hover { color: #582017; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  </style>
</head>
<body class="site-home">
  <main>
    <header>
      <h1>Листы персонажей D&amp;D</h1>
      <p>Выберите персонажа, чтобы открыть лист 1-го уровня.</p>
      <nav class="quick-links" aria-label="Инструменты">
        <a href="party.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" focusable="false">
            <circle cx="8.5" cy="7.5" r="3"/>
            <path d="M2.5 19v-1a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v1M16 5a3 3 0 0 1 0 6m.5 3a4 4 0 0 1 4 4v1"/>
          </svg>
          Сводка группы
        </a>
        <a href="character-generator.html">
          <img src="assets/D12.svg" alt="" width="20" height="20">
          Генератор
        </a>
      </nav>
    </header>
    <nav aria-label="Листы по персонажам">
      <ul class="characters" role="list">
        <li class="character">
          <h2>Аэльт</h2>
          <p class="character-class">Волшебник</p>
          <a href="character-sheets/aelt/index.html" aria-label="Лист 1-го уровня — Аэльт">Лист 1-го уровня</a>
        </li>
        <li class="character">
          <h2>Вега</h2>
          <p class="character-class">Изобретатель</p>
          <a href="character-sheets/vega/index.html" aria-label="Лист 1-го уровня — Вега">Лист 1-го уровня</a>
        </li>
        <li class="character">
          <h2>Наэстриель</h2>
          <p class="character-class">Бард</p>
          <a href="character-sheets/naestriel/index.html" aria-label="Лист 1-го уровня — Наэстриель">Лист 1-го уровня</a>
        </li>
      </ul>
    </nav>
  </main>
</body>
</html>
