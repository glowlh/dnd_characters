  <script>
    const party = JSON.parse(document.getElementById('party-data').textContent);
    const rows = document.getElementById('party-rows');

    for (const character of party) {
      const row = rows.insertRow();
      const heading = document.createElement('th');
      heading.scope = 'row';
      const link = document.createElement('a');
      link.href = character.href;
      link.textContent = character.name;
      heading.append(link);
      row.append(heading);

      const scores = character.abilities.map(ability => `${ability.score} (${ability.mod})`);
      const values = [...scores, character.perception, character.hp, character.armorClass,
        character.spellDc ?? '—', character.abilities[2].mod];
      for (const value of values) row.insertCell().textContent = value;
    }

    if (party.length) {
      // D&D 2024 encounter XP budget for one level 1 character.
      const [low, moderate, high] = [50, 75, 100].map(xp => xp * party.length);
      document.getElementById('party-budget').textContent =
        `Бюджет противников по D&D 2024 — ${low} XP для низкой сложности, ${moderate} XP для средней и ${high} XP для высокой.`;

      const sum = select => party.reduce((total, character) => total + select(character), 0);
      // Compare effective HP against a +4 attack with four level 1 characters at 9 HP and AC 13.
      const hitChance = armorClass => Math.max(0.05, Math.min(0.95, (25 - armorClass) / 20));
      const referenceHp = 4 * 9 / hitChance(13);
      const relativeHp = sum(character => character.hp / hitChance(character.armorClass)) / referenceHp;
      const rating = document.getElementById('party-rating');
      const strength = relativeHp < 0.8 ? 'weak' : relativeHp > 1.2 ? 'strong' : 'medium';
      rating.dataset.strength = strength;
      rating.textContent = {weak: 'Слабая группа', medium: 'Средняя группа', strong: 'Сильная группа'}[strength];
      rating.hidden = false;

      const abilityTotals = party[0].abilities.map(({name}, index) =>
        ({name, total: sum(character => character.abilities[index].score)}));
      const extremes = find => {
        const total = find(...abilityTotals.map(ability => ability.total));
        return abilityTotals.filter(ability => ability.total === total).map(ability => `«${ability.name}»`).join(', ');
      };
      const format = new Intl.NumberFormat('ru', {maximumFractionDigits: 1});
      const averageArmor = format.format(sum(character => character.armorClass) / party.length);
      const bestPerception = Math.max(...party.map(character => character.perception));
      document.getElementById('party-profile').textContent =
        `Наибольшие средние значения — ${extremes(Math.max)}, наименьшие — ${extremes(Math.min)}. ` +
        `Запас группы — ${sum(character => character.hp)} хитов, средний КД — ${averageArmor}, максимальное пассивное Восприятие — ${bestPerception}.`;
    } else {
      document.getElementById('party-budget').textContent = 'В группе пока нет персонажей.';
    }
  </script>
